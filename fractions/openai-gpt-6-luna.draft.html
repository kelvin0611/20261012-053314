<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美味薄餅學分數</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&amp;family=Nunito:wght@400;700&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #F7F3FF;
    --fg: #3A2340;
    --muted: #5B4A6B;
    --surface: #FFFFFF;
    --border: #E7E1EE;
    --accent: #6B3FA0;
    --accent-fg: #FFFFFF;
    --ok: #1F7A45;
    --warn: #C2185B;
    --palette: #FFD6E0, #C3F0CA, #B8E1FF, #FFE9A8;
    --radius: 30px;
    --shadow: 0 12px 0 -4px rgba(58,35,64,.10),0 18px 28px rgba(58,35,64,.14),inset 0 -4px 0 rgba(58,35,64,.06);
    --font-display: 'Fredoka','Noto Sans TC',sans-serif;
    --font-body: 'Nunito','Noto Sans TC',sans-serif;
    --gap: clamp(12px, 2vw, 24px);
    --crust: #C87937;
    --crust-light: #E6A454;
    --cheese: #F6D76A;
    --cheese-light: #FFE891;
    --tomato: #C94E49;
    --mushroom: #FFF3D2;
    --wood: #D9A56D;
    --wood-light: #F0CB95;
    --line: #8A4F2C;
    --eat: #C56A27;
    --divide: #236CA0;
    --soft-shadow: 0 10px 16px rgba(58,35,64,.17);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 22px; line-height: 1.5; overflow: hidden; }
  .topbar { display: flex; align-items: center; gap: var(--gap); padding: var(--gap) calc(var(--gap) * 1.5); }
  .topbar h1 { font-family: var(--font-display); font-size: clamp(28px, 3vw, 42px); margin: 0; line-height: 1.15; }
  .topbar .goal { color: var(--muted); margin: 0; font-size: 20px; }
  .topbar .spacer { flex: 1; }
  #stage { position: relative; min-height: 0; overflow: hidden; background: var(--surface); }
  .card { border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
  #controls { display: flex; flex-direction: column; gap: 14px; overflow: auto; padding: var(--gap); background: var(--surface); }
  .btn { font: 700 20px var(--font-body); min-height: 56px; padding: 10px 22px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  label { font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  /* explorer: title, one large stage, control dock along the bottom */
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  #stage { margin: 0 calc(var(--gap) * 1.5); }
  #controls { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; margin: var(--gap) calc(var(--gap) * 1.5); }

  .topbar { min-height: 82px; }
  .topbar .goal { max-width: 690px; }
  #stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(245px, 300px); align-items: stretch; }
  .pizza-side { position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #pizza-scene { display: block; width: 100%; height: 100%; overflow: visible; }
  .score-side { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 22px 22px 24px 14px; text-align: center; }
  .score-side::before { content: ""; position: absolute; left: 0; top: 13%; bottom: 13%; width: 2px; background: var(--border); border-radius: 2px; }
  .board-title { margin: 0 0 8px; font-size: 26px; line-height: 1.2; }
  .fraction-wrap { position: relative; min-width: 150px; margin: 0 auto; }
  #fraction { display: flex; min-height: 136px; justify-content: center; align-items: center; font-size: clamp(76px, 9vw, 112px); line-height: 1; }
  #fraction .katex { font-size: 1em; }
  #fraction .mfrac > span > span:first-child { color: var(--eat); }
  #fraction .mfrac > span > span:last-child { color: var(--divide); }
  #fraction .frac-line { border-color: var(--fg); }
  #fraction-fallback { display: none; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 82px; line-height: .92; }
  #fraction-fallback .num { color: var(--eat); }
  #fraction-fallback .den { color: var(--divide); }
  #fraction-fallback .bar { height: 5px; width: 75px; border-radius: 5px; background: var(--fg); margin: 8px 0; }
  .reading { min-height: 42px; margin: 0 0 12px; color: var(--accent); font-weight: 700; font-size: 24px; }
  .number-key { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; width: 100%; max-width: 228px; margin: 5px auto 12px; }
  .key-line { display: flex; align-items: center; gap: 9px; font-size: 19px; line-height: 1.25; color: var(--muted); text-align: left; }
  .key-mark { min-width: 36px; font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  .key-mark.num { color: var(--eat); }
  .key-mark.den { color: var(--divide); }
  .live-note { margin: 0; padding: 9px 14px; border-radius: 18px; background: var(--bg); color: var(--muted); font-size: 18px; line-height: 1.35; }
  .scene-hint { position: absolute; left: 20px; bottom: 14px; margin: 0; padding: 5px 12px; border-radius: 16px; background: var(--surface); color: var(--muted); font-size: 17px; box-shadow: var(--soft-shadow); pointer-events: none; }
  .control-group { display: flex; flex-direction: column; gap: 8px; }
  .choice-group { align-items: center; }
  .control-label { color: var(--muted); font-size: 20px; font-weight: 700; line-height: 1.2; }
  .piece-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .piece-btn { min-width: 62px; min-height: 56px; padding: 7px 15px; border: 2px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--fg); font: 700 21px var(--font-body); cursor: pointer; box-shadow: 0 4px 0 rgba(58,35,64,.07); transition: transform .15s ease, background .15s ease, border-color .15s ease; }
  .piece-btn:hover { transform: translateY(-2px); }
  .piece-btn:active { transform: scale(.96); }
  .piece-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .piece-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .action-group { flex-direction: row; align-items: center; justify-content: center; gap: 10px; }
  .action-group .btn { white-space: nowrap; }
  #controls { min-height: 108px; }
  .plate-label { font-size: 19px; font-weight: 700; fill: var(--muted); }
  .pizza-text { font-family: var(--font-body); }
  .svg-clickable { cursor: pointer; }
  .svg-clickable:focus-visible { outline: none; }
  .svg-clickable:hover .slice-face { filter: brightness(1.035); }
  #reset-btn, #fullscreen-btn { white-space: nowrap; }
  @media (max-width: 900px) {
    .topbar { gap: 10px; padding: 12px 18px; }
    .topbar .goal { font-size: 18px; }
    #stage { grid-template-columns: minmax(0, 1fr) 235px; }
    .score-side { padding: 14px 12px; }
    .board-title { font-size: 23px; }
    .key-line { font-size: 17px; }
    #controls { gap: 10px; padding: 12px; }
    .piece-btn { min-width: 56px; }
  }
  @media (max-width: 680px) {
    body { grid-template-rows: auto minmax(0,1fr) auto; }
    .topbar { flex-wrap: wrap; }
    .topbar > div:first-child { flex: 1 1 100%; }
    .topbar .spacer { display: none; }
    #stage { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; }
    .score-side { padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; }
    .score-side::before { display: none; }
    .board-title { margin: 0; }
    .fraction-wrap { grid-column: 1; grid-row: 2 / 4; }
    #fraction { min-height: 100px; font-size: 70px; }
    .reading { grid-column: 2; min-height: 0; margin: 0; }
    .number-key { grid-column: 2; width: auto; margin: 0; }
    .live-note { grid-column: 1 / -1; }
    .scene-hint { display: none; }
    #controls { margin-top: 8px; }
  }
</style>
<script>
/*
 * Viz kit — shared classroom helpers injected into every generated visual.
 * The coder model only writes the scene and calls these; the chrome (caption bar,
 * Prev/Next, Reset, fullscreen, keyboard) behaves the same on every page.
 */
(function () {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const resetHandlers = [];
    let steps = [];
    let currentStep = 0;
    let runningLoop = null;

    const byId = (id) => document.getElementById(id);

    const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    };

    // Layouts without a caption bar get a floating step navigator inside the stage.
    const ensureStepBar = () => {
        if (byId('caption-text')) return;
        const bar = element('div', 'viz-stepbar');
        bar.innerHTML = '<button class="btn" id="prev-btn" type="button">←</button>'
            + '<div class="text" id="caption-text"></div><span id="step-indicator"></span>'
            + '<button class="btn primary" id="next-btn" type="button">→</button>';
        byId('stage').append(bar);
    };

    const showStep = (index, direction) => {
        if (!steps.length) return;
        ensureStepBar();
        currentStep = Math.max(0, Math.min(steps.length - 1, index));
        const step = steps[currentStep];
        byId('caption-text').textContent = step.caption || '';
        byId('step-indicator').textContent = '步驟 ' + (currentStep + 1) + ' / ' + steps.length;
        byId('prev-btn').disabled = currentStep === 0;
        byId('next-btn').disabled = currentStep === steps.length - 1;
        if (typeof step.show === 'function') step.show(direction || 'jump');
    };

    const reset = () => {
        resetHandlers.forEach((handler) => handler());
        showStep(0, 'reset');
    };

    const toggleFullscreen = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());

    // Layouts without a control panel get a floating dock inside the stage.
    const controls = () => {
        if (!byId('controls')) {
            const dock = element('div', 'viz-dock');
            dock.id = 'controls';
            byId('stage').append(dock);
        }
        return byId('controls');
    };

    const field = (labelText) => {
        const wrapper = element('div', 'viz-field');
        wrapper.append(element('label', null, labelText));
        controls().append(wrapper);
        return wrapper;
    };

    window.Viz = {
        reducedMotion,

        /** Seconds to use for an animation: 0 when the viewer prefers reduced motion. */
        duration: (seconds) => (reducedMotion ? 0 : seconds),

        /** Read a style token, e.g. Viz.color('--accent'). */
        color: (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),

        /** The scene container and its current size. */
        stage: () => byId('stage'),
        size: () => ({ width: byId('stage').clientWidth, height: byId('stage').clientHeight }),
        onResize: (handler) => new ResizeObserver(() => handler(window.Viz.size())).observe(byId('stage')),

        /**
         * Register the teaching steps. Each item: caption (string) and show(direction).
         * show() must put the scene into that step's complete state so Prev and Reset work.
         */
        steps: (list) => {
            steps = list;
            showStep(0, 'start');
        },
        goTo: (index) => showStep(index, 'jump'),
        currentStep: () => currentStep,

        /** Run handler when Reset is pressed (before returning to step 1). */
        onReset: (handler) => resetHandlers.push(handler),

        button: (labelText, onClick, primary) => {
            const button = element('button', 'btn' + (primary ? ' primary' : ''), labelText);
            button.type = 'button';
            button.addEventListener('click', onClick);
            controls().append(button);
            return button;
        },

        slider: (options) => {
            const wrapper = field(options.label);
            const input = element('input');
            const output = element('output', 'viz-value');
            Object.assign(input, { type: 'range', min: options.min, max: options.max, step: options.step || 1, value: options.value });
            const render = () => { output.textContent = input.value + (options.unit ? ' ' + options.unit : ''); };
            input.addEventListener('input', () => { render(); options.onInput && options.onInput(Number(input.value)); });
            render();
            wrapper.append(input, output);
            resetHandlers.push(() => { input.value = options.value; render(); options.onInput && options.onInput(Number(options.value)); });
            return input;
        },

        toggle: (labelText, checked, onChange) => {
            const wrapper = element('label', 'viz-toggle');
            const input = element('input');
            input.type = 'checkbox';
            input.checked = !!checked;
            input.addEventListener('change', () => onChange && onChange(input.checked));
            wrapper.append(input, document.createTextNode(' ' + labelText));
            controls().append(wrapper);
            resetHandlers.push(() => { input.checked = !!checked; onChange && onChange(input.checked); });
            return input;
        },

        /**
         * Make an element draggable onto drop targets (touch and mouse).
         * options: targets (elements), onDrop(target, element) returns true to accept; rejected drops spring back.
         */
        draggable: (node, options) => {
            let startX = 0, startY = 0, originX = 0, originY = 0;
            node.style.touchAction = 'none';
            node.style.cursor = 'grab';
            node.addEventListener('pointerdown', (event) => {
                node.setPointerCapture(event.pointerId);
                startX = event.clientX; startY = event.clientY;
                const transform = new DOMMatrixReadOnly(getComputedStyle(node).transform);
                originX = transform.m41; originY = transform.m42;
                node.style.zIndex = 10;
                node.style.cursor = 'grabbing';
            });
            node.addEventListener('pointermove', (event) => {
                if (!node.hasPointerCapture(event.pointerId)) return;
                node.style.transform = 'translate(' + (originX + event.clientX - startX) + 'px,' + (originY + event.clientY - startY) + 'px)';
            });
            node.addEventListener('pointerup', (event) => {
                node.releasePointerCapture(event.pointerId);
                node.style.cursor = 'grab';
                const box = node.getBoundingClientRect();
                const centerX = box.left + box.width / 2, centerY = box.top + box.height / 2;
                const target = (options.targets || []).find((candidate) => {
                    const area = candidate.getBoundingClientRect();
                    return centerX > area.left && centerX < area.right && centerY > area.top && centerY < area.bottom;
                });
                const accepted = target && options.onDrop ? options.onDrop(target, node) !== false : false;
                if (!accepted) {
                    node.style.transition = reducedMotion ? 'none' : 'transform .35s cubic-bezier(.34,1.56,.64,1)';
                    node.style.transform = 'translate(' + originX + 'px,' + originY + 'px)';
                    setTimeout(() => { node.style.transition = ''; }, 400);
                }
            });
        },

        /** Short star burst for a right answer, centred on an element (or the stage). */
        celebrate: (node) => {
            const area = (node || byId('stage')).getBoundingClientRect();
            const colours = (window.Viz.color('--palette') || '#FFD166').split(',').map((colour) => colour.trim());
            for (let i = 0; i < (reducedMotion ? 0 : 18); i++) {
                const star = element('span', 'viz-star', '★');
                star.style.left = area.left + area.width / 2 + 'px';
                star.style.top = area.top + area.height / 2 + 'px';
                star.style.color = colours[i % colours.length];
                document.body.append(star);
                const angle = (Math.PI * 2 * i) / 18, distance = 80 + Math.random() * 90;
                star.animate([
                    { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
                    { transform: 'translate(calc(-50% + ' + Math.cos(angle) * distance + 'px), calc(-50% + ' + Math.sin(angle) * distance + 'px)) scale(1.2)', opacity: 0 },
                ], { duration: 900, easing: 'cubic-bezier(.22,1,.36,1)' }).onfinish = () => star.remove();
            }
            window.Viz.hint('做得好！', 'ok');
        },

        /** Gentle message over the stage, e.g. Viz.hint('再試一次') for a wrong answer. */
        hint: (text, tone) => {
            const toast = element('div', 'viz-hint' + (tone === 'ok' ? ' ok' : ''), text);
            byId('stage').append(toast);
            setTimeout(() => toast.remove(), 1800);
        },

        /** Update the game HUD (game layout) or a floating badge: Viz.score(3), Viz.round(2, 5). */
        score: (value) => { const target = byId('hud-score'); if (target) target.textContent = value; },
        round: (current, total) => { const target = byId('hud-round'); if (target) target.textContent = current + ' / ' + total; },

        /** requestAnimationFrame loop that pauses when the tab is hidden; Space toggles it. */
        loop: (frame) => {
            let last = performance.now(), paused = false;
            const tick = (now) => {
                if (!paused && !document.hidden) frame(Math.min(0.05, (now - last) / 1000), now / 1000);
                last = now;
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            runningLoop = { pause: () => { paused = true; }, play: () => { paused = false; }, toggle: () => { paused = !paused; }, isPaused: () => paused };
            return runningLoop;
        },
    };

    document.addEventListener('DOMContentLoaded', () => {
        const style = element('style');
        style.textContent = '.viz-field{display:flex;flex-direction:column;gap:6px}.viz-value{font-weight:700;color:var(--accent)}'
            + '.viz-toggle{display:flex;align-items:center;gap:10px;min-height:56px;font-weight:600}.viz-toggle input{width:28px;height:28px;accent-color:var(--accent)}'
            + '.viz-star{position:fixed;pointer-events:none;font-size:28px;z-index:50}'
            + '.viz-hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:var(--surface);color:var(--fg);border:2px solid var(--warn);font-weight:700;box-shadow:var(--shadow);z-index:20}'
            + '.viz-hint.ok{border-color:var(--ok)}.btn:disabled{opacity:.4;cursor:default}'
            + '.viz-stepbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:8px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-weight:600;z-index:15}'
            + '.viz-stepbar .text{padding:0 6px}.viz-stepbar #step-indicator{color:var(--muted);white-space:nowrap}'
            + '.viz-dock{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:10px;max-width:300px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);z-index:15}';
        document.head.append(style);

    });

    // One delegated listener, so chrome buttons work whether they come from the skeleton or are created later.
    document.addEventListener('click', (event) => {
        const button = event.target.closest && event.target.closest('#prev-btn, #next-btn, #reset-btn, #fullscreen-btn');
        if (!button) return;
        if (button.id === 'prev-btn') showStep(currentStep - 1, 'back');
        if (button.id === 'next-btn') showStep(currentStep + 1, 'forward');
        if (button.id === 'reset-btn') reset();
        if (button.id === 'fullscreen-btn') toggleFullscreen();
    });

    document.addEventListener('keydown', (event) => {
        if (event.target.closest && event.target.closest('input, textarea')) return;
        if (event.key === 'ArrowRight') showStep(currentStep + 1, 'forward');
        if (event.key === 'ArrowLeft') showStep(currentStep - 1, 'back');
        if (event.key === 'r' || event.key === 'R') reset();
        if (event.key === 'f' || event.key === 'F') toggleFullscreen();
        if (event.key === ' ' && runningLoop) { event.preventDefault(); runningLoop.toggle(); }
    });
})();

</script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>美味薄餅學分數</h1>
      <p class="goal">明白分數的分母代表等分的總件數，分子代表取出的件數。</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="reset-btn" type="button">↺ 重新開始</button>
    <button class="btn" id="fullscreen-btn" type="button" aria-label="全螢幕 (F)">全螢幕</button>
  </header>
  <main id="stage" class="card" aria-label="薄餅分數演示畫面">
    <section class="pizza-side" aria-label="可點擊的薄餅和吃掉的薄餅件">
      <svg id="pizza-scene" viewBox="0 0 780 560" role="img" aria-label="薄餅切成相等的份數，點擊一件即可吃掉">
        <defs>
          <filter id="plate-shadow" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#3A2340" flood-opacity=".16"/>
          </filter>
        </defs>
        <g id="plate-art" filter="url(#plate-shadow)">
          <circle cx="610" cy="300" r="120" fill="var(--wood)"/>
          <circle cx="610" cy="300" r="107" fill="var(--surface)"/>
          <circle cx="610" cy="300" r="95" fill="var(--wood-light)" opacity=".4"/>
        </g>
        <text x="610" y="445" text-anchor="middle" class="plate-label pizza-text">吃掉的薄餅件</text>
        <g id="pizza-art" filter="url(#plate-shadow)">
          <circle cx="270" cy="280" r="211" fill="var(--crust)"/>
          <circle cx="270" cy="280" r="198" fill="var(--crust-light)"/>
          <circle cx="270" cy="280" r="184" fill="var(--cheese)"/>
          <circle cx="270" cy="280" r="175" fill="var(--cheese-light)" opacity=".55"/>
        </g>
        <g id="ghost-layer"></g>
        <g id="slice-layer"></g>
        <g id="cut-lines" pointer-events="none"></g>
        <circle cx="270" cy="280" r="5" fill="var(--line)" pointer-events="none"/>
      </svg>
      <p class="scene-hint">點一下薄餅的一份，試試看！</p>
    </section>
    <aside class="score-side" aria-live="polite" aria-label="即時分數看板">
      <h2 class="board-title">薄餅分數</h2>
      <div class="fraction-wrap">
        <div id="fraction" aria-label="分數"></div>
        <div id="fraction-fallback" aria-hidden="true">
          <span class="num" id="fallback-num">0</span><span class="bar"></span><span class="den" id="fallback-den">4</span>
        </div>
      </div>
      <p class="reading" id="reading">未食任何一件</p>
      <div class="number-key">
        <div class="key-line"><span class="key-mark num">分子</span><span>吃了件數</span></div>
        <div class="key-line"><span class="key-mark den">分母</span><span>等分總數</span></div>
        <div class="key-line"><span class="key-mark">分數線</span><span>分開上下兩個數</span></div>
      </div>
      <p class="live-note" id="live-note">薄餅平均分成 <strong id="live-total">4</strong> 份；已吃 <strong id="live-eaten">0</strong> 份。</p>
    </aside>
  </main>
  <div id="controls" class="card" aria-label="控制面板">
    <div class="control-group choice-group">
      <span class="control-label">切開件數（分母）</span>
      <div class="piece-options" role="group" aria-label="選擇薄餅等分份數">
        <button class="piece-btn" type="button" data-total="2" aria-pressed="false">2 件</button>
        <button class="piece-btn" type="button" data-total="3" aria-pressed="false">3 件</button>
        <button class="piece-btn" type="button" data-total="4" aria-pressed="true">4 件</button>
        <button class="piece-btn" type="button" data-total="6" aria-pressed="false">6 件</button>
        <button class="piece-btn" type="button" data-total="8" aria-pressed="false">8 件</button>
      </div>
    </div>
    <div class="control-group action-group">
      <button class="btn primary" id="play-btn" type="button" aria-pressed="false">▶ 自動示範</button>
      <button class="btn" id="make-again-btn" type="button">重新整過一個薄餅</button>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const cx = 270, cy = 280, radius = 184;
  const plateX = 610, plateY = 300;
  const sliceLayer = document.getElementById('slice-layer');
  const ghostLayer = document.getElementById('ghost-layer');
  const cutLines = document.getElementById('cut-lines');
  const fractionEl = document.getElementById('fraction');
  const fallbackEl = document.getElementById('fraction-fallback');
  const readingEl = document.getElementById('reading');
  const totalReadout = document.getElementById('live-total');
  const eatenReadout = document.getElementById('live-eaten');
  const playBtn = document.getElementById('play-btn');
  let total = 4;
  let eaten = new Set();
  let isPlaying = false;
  let playElapsed = 0;

  const hasGsap = typeof window.gsap !== 'undefined';
  if (hasGsap && window.Draggable && window.MotionPathPlugin) {
    try { gsap.registerPlugin(Draggable, MotionPathPlugin); } catch (e) {}
  }

  function duration(seconds) {
    return window.Viz && typeof Viz.duration === 'function'
      ? Viz.duration(seconds)
      : (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : seconds);
  }

  function polar(r, angle) {
    const a = angle * Math.PI / 180;
    return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
  }

  function sectorPath(index, n, r) {
    const a1 = -90 + index * 360 / n;
    const a2 = -90 + (index + 1) * 360 / n;
    const p1 = polar(r, a1), p2 = polar(r, a2);
    const large = (a2 - a1) > 180 ? 1 : 0;
    return `M ${cx} ${cy} L ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y} Z`;
  }

  function svgEl(name, attrs) {
    const el = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
    return el;
  }

  function addToppings(group, index, n) {
    const middle = -90 + (index + .5) * 360 / n;
    const p = polar(105, middle);
    const shift = ((index % 3) - 1) * 11;
    if (index % 2 === 0) {
      const tomato = svgEl('circle', {
        cx: p.x + shift, cy: p.y, r: 12,
        fill: 'var(--tomato)', stroke: 'var(--crust)', 'stroke-width': 3
      });
      const glint = svgEl('circle', {
        cx: p.x + shift - 3, cy: p.y - 4, r: 3.2, fill: 'var(--surface)', opacity: .72
      });
      group.append(tomato, glint);
    } else {
      const mx = p.x + shift, my = p.y;
      const cap = svgEl('path', {
        d: `M ${mx-14} ${my+2} Q ${mx-12} ${my-15} ${mx} ${my-15} Q ${mx+13} ${my-14} ${mx+14} ${my+2} Z`,
        fill: 'var(--mushroom)', stroke: 'var(--crust)', 'stroke-width': 3,
        'stroke-linejoin': 'round'
      });
      const stem = svgEl('path', {
        d: `M ${mx-8} ${my+1} L ${mx-6} ${my+11} Q ${mx} ${my+15} ${mx+6} ${my+11} L ${mx+8} ${my+1} Z`,
        fill: 'var(--mushroom)', stroke: 'var(--crust)', 'stroke-width': 2
      });
      group.append(cap, stem);
    }
    const herb = svgEl('circle', {
      cx: p.x + shift + 22, cy: p.y + 20, r: 4,
      fill: 'var(--ok)', opacity: .82
    });
    group.appendChild(herb);
  }

  function drawLines(animate) {
    cutLines.replaceChildren();
    for (let i = 0; i < total; i++) {
      const angle = -90 + i * 360 / total;
      const p = polar(radius, angle);
      const line = svgEl('line', {
        x1: cx, y1: cy, x2: p.x, y2: p.y,
        stroke: 'var(--line)', 'stroke-width': 3.5, 'stroke-linecap': 'round',
        opacity: .92, class: 'cut-line'
      });
      cutLines.appendChild(line);
      if (animate && hasGsap) {
        const len = Math.hypot(p.x - cx, p.y - cy);
        gsap.set(line, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 });
        gsap.to(line, {
          strokeDashoffset: 0, opacity: .92,
          duration: duration(.4), ease: 'elastic.out(1, 0.5)', delay: duration(i * .018)
        });
      }
    }
  }

  function getReading() {
    if (eaten.size === 0) return '未食任何一件';
    if (eaten.size === total) return '食晒一個薄餅！';
    const den = {2:'二',3:'三',4:'四',6:'六',8:'八'}[total] || String(total);
    const num = {1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八'}[eaten.size] || String(eaten.size);
    return `${den}分之${num}`;
  }

  function updateBoard(animate) {
    totalReadout.textContent = String(total);
    eatenReadout.textContent = String(eaten.size);
    readingEl.textContent = getReading();

    if (window.katex && typeof katex.render === 'function') {
      try {
        katex.render(`\\frac{${eaten.size}}{${total}}`, fractionEl, { throwOnError: false, displayMode: true });
        fractionEl.style.display = 'flex';
        fallbackEl.style.display = 'none';
        fractionEl.setAttribute('aria-label', `分子 ${eaten.size}，分母 ${total}`);
      } catch (e) { showFallback(); }
    } else {
      showFallback();
    }

    if (animate && hasGsap) {
      gsap.fromTo(fractionEl, { scale: 1, y: 0 }, {
        scale: 1.2, y: -7, duration: duration(.16), ease: 'back.out(2)',
        yoyo: true, repeat: 1, transformOrigin: '50% 50%'
      });
      gsap.fromTo(readingEl, { opacity: .25, y: 5 }, {
        opacity: 1, y: 0, duration: duration(.35), ease: 'power1.out'
      });
    }
  }

  function showFallback() {
    fractionEl.style.display = 'none';
    fallbackEl.style.display = 'flex';
    document.getElementById('fallback-num').textContent = String(eaten.size);
    document.getElementById('fallback-den').textContent = String(total);
  }

  function buildPizza(animateLines) {
    sliceLayer.replaceChildren();
    ghostLayer.replaceChildren();

    for (let i = 0; i < total; i++) {
      const ghost = svgEl('path', {
        d: sectorPath(i, total, radius),
        fill: 'var(--surface)', opacity: 0,
        stroke: 'var(--surface)', 'stroke-width': 5,
        'stroke-dasharray': '7 8', 'stroke-linejoin': 'round',
        class: 'ghost-slice', 'data-index': i
      });
      ghostLayer.appendChild(ghost);

      const group = svgEl('g', {
        class: 'svg-clickable slice-group',
        role: 'button',
        tabindex: '0',
        'aria-label': `薄餅第${i + 1}份，點擊吃掉`,
        'data-index': i
      });
      const face = svgEl('path', {
        d: sectorPath(i, total, radius),
        fill: 'var(--cheese)', class: 'slice-face'
      });
      group.appendChild(face);
      addToppings(group, i, total);
      group.addEventListener('click', () => eatSlice(i));
      group.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          eatSlice(i);
        }
      });
      sliceLayer.appendChild(group);
    }
    drawLines(animateLines);
  }

  function eatSlice(index) {
    if (eaten.has(index) || eaten.size >= total) return;
    eaten.add(index);

    const group = sliceLayer.querySelector(`[data-index="${index}"]`);
    const ghost = ghostLayer.querySelector(`[data-index="${index}"]`);
    if (ghost) ghost.setAttribute('opacity', '.88');
    if (group) {
      group.classList.remove('svg-clickable');
      group.setAttribute('aria-label', `已吃掉第${index + 1}份`);
      group.style.pointerEvents = 'none';
      const angle = -90 + (index + .5) * 360 / total;
      const start = polar(radius * .55, angle);
      const slot = eaten.size - 1;
      const slotAngle = -90 + slot * (360 / Math.max(total, 4));
      const scale = .36;
      const targetX = plateX + Math.cos(slotAngle * Math.PI / 180) * 27;
      const targetY = plateY + Math.sin(slotAngle * Math.PI / 180) * 27;
      const dx = targetX - (cx + scale * (start.x - cx));
      const dy = targetY - (cy + scale * (start.y - cy));
      if (hasGsap && duration(.5) > 0) {
        const others = Array.from(sliceLayer.querySelectorAll('.slice-group')).filter(el => el !== group && el.style.pointerEvents !== 'none');
        gsap.to(others, { opacity: .35, duration: duration(.12), overwrite: true });
        gsap.to(group, {
          x: dx, y: dy, scale: scale, rotation: 0,
          transformOrigin: `${cx}px ${cy}px`,
          duration: duration(.5), ease: 'power2.out',
          onComplete: () => gsap.to(others, { opacity: 1, duration: duration(.18), overwrite: true })
        });
      } else {
        group.setAttribute('transform', `translate(${dx} ${dy}) translate(${cx} ${cy}) scale(${scale}) translate(${-cx} ${-cy})`);
      }
    }
    updateBoard(true);
    if (window.Viz && typeof Viz.celebrate === 'function' && eaten.size === total) {
      Viz.celebrate(document.getElementById('fraction'));
    }
  }

  function selectTotal(next, animate) {
    total = next;
    eaten = new Set();
    stopPlaying();
    document.querySelectorAll('.piece-btn').forEach(btn => {
      btn.setAttribute('aria-pressed', String(Number(btn.dataset.total) === total));
    });
    buildPizza(animate);
    updateBoard(animate);
    const art = document.getElementById('pizza-art');
    if (animate && hasGsap) {
      gsap.fromTo(art, { scale: 1 }, {
        scale: 1.03, duration: duration(.16), yoyo: true, repeat: 1,
        transformOrigin: `${cx}px ${cy}px`, ease: 'back.out(1.7)'
      });
    }
  }

  function resetPizza() {
    stopPlaying();
    eaten = new Set();
    buildPizza(false);
    updateBoard(false);
  }

  function stopPlaying() {
    isPlaying = false;
    playElapsed = 0;
    playBtn.setAttribute('aria-pressed', 'false');
    playBtn.textContent = '▶ 自動示範';
  }

  function togglePlay() {
    if (isPlaying) {
      stopPlaying();
      return;
    }
    if (eaten.size >= total) {
      eaten = new Set();
      buildPizza(false);
      updateBoard(false);
    }
    isPlaying = true;
    playElapsed = 0;
    playBtn.setAttribute('aria-pressed', 'true');
    playBtn.textContent = 'Ⅱ 暫停示範';
  }

  document.querySelectorAll('.piece-btn').forEach(btn => {
    btn.addEventListener('click', () => selectTotal(Number(btn.dataset.total), true));
  });
  document.getElementById('make-again-btn').addEventListener('click', resetPizza);
  document.getElementById('reset-btn').addEventListener('click', resetPizza);
  playBtn.addEventListener('click', togglePlay);

  document.getElementById('fullscreen-btn').addEventListener('click', () => {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  });

  document.addEventListener('keydown', event => {
    if (event.target && /INPUT|TEXTAREA|BUTTON/.test(event.target.tagName) && event.key !== 'Escape') return;
    if (event.key.toLowerCase() === 'r') resetPizza();
    if (event.key.toLowerCase() === 'f') document.getElementById('fullscreen-btn').click();
    if (event.code === 'Space' && !event.repeat) {
      event.preventDefault();
      togglePlay();
    }
  });

  function animateLoop(dt) {
    if (!isPlaying) return;
    playElapsed += typeof dt === 'number' ? dt : 0;
    if (playElapsed >= 1.35) {
      playElapsed = 0;
      let next = 0;
      while (next < total && eaten.has(next)) next++;
      if (next < total) eatSlice(next);
      if (eaten.size >= total) stopPlaying();
    }
  }

  if (window.Viz && typeof Viz.loop === 'function') {
    Viz.loop((dt) => animateLoop(dt));
  } else {
    let last = performance.now();
    function tick(now) {
      const dt = Math.min((now - last) / 1000, .1);
      last = now;
      animateLoop(dt);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  if (window.Viz && typeof Viz.onReset === 'function') Viz.onReset(resetPizza);
  if (window.Viz && typeof Viz.onResize === 'function') {
    Viz.onResize(() => {
      const svg = document.getElementById('pizza-scene');
      if (svg) svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    });
  }

  buildPizza(false);
  updateBoard(false);
});
</script>
</body>
</html>
