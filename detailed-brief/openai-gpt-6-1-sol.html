<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>認識香港的天氣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&amp;family=Nunito:wght@400;700&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
<style>
  :root {
    --bg: #F7F3FF;
    --fg: #3A2340;
    --muted: #5B4A6B;
    --surface: #FFFFFF;
    --border: #E7E1EE;
    --accent: #6B3FA0;
    --accent-fg: #FFFFFF;
    --ok: #1F7A45;
    --warn: #C2185B;
    --palette: #FFD6E0, #C3F0CA, #B8E1FF, #FFE9A8;
    --radius: 30px;
    --shadow: 0 12px 0 -4px rgba(58,35,64,.10),0 18px 28px rgba(58,35,64,.14),inset 0 -4px 0 rgba(58,35,64,.06);
    --font-display: 'Fredoka','Noto Sans TC',sans-serif;
    --font-body: 'Nunito','Noto Sans TC',sans-serif;
    --gap: clamp(12px, 2vw, 24px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 22px; line-height: 1.5; overflow: hidden; }
  .topbar { display: flex; align-items: center; gap: var(--gap); padding: var(--gap) calc(var(--gap) * 1.5); }
  .topbar h1 { font-family: var(--font-display); font-size: clamp(28px, 3vw, 42px); margin: 0; line-height: 1.15; }
  .topbar .goal { color: var(--muted); margin: 0; font-size: 20px; }
  .topbar .spacer { flex: 1; }
  #stage { position: relative; min-height: 0; overflow: hidden; background: var(--surface); }
  .card { border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
  #controls { display: flex; flex-direction: column; gap: 14px; overflow: auto; padding: var(--gap); background: var(--surface); }
  .btn { font: 700 20px var(--font-body); min-height: 56px; padding: 10px 22px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  label { font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  body { display: grid; grid-template-rows: auto 1fr; }
  .layout { display: grid; grid-template-columns: 3fr 2fr; gap: var(--gap); padding: 0 calc(var(--gap) * 1.5) var(--gap); min-height: 0; }
  #panel { display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
  #explanation { display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  :root {
    --bg:#EFF8FF; --fg:#17394F; --muted:#405C70; --accent:#096A9E;
    --border:#C9E2F0; --palette:#A7DDF7,#FFFFFF,#A9D8B6,#FFE9A8;
    --shadow:0 8px 0 -4px rgba(23,57,79,.09),0 12px 24px rgba(23,57,79,.10),inset 0 -4px 0 rgba(23,57,79,.05);
    --sky:#A7DDF7; --rain-sky:#839CAE; --storm-sky:#536B80; --cold-sky:#CEDFEF;
    --leaf:#4D9470; --leaf-light:#86BD91; --trunk:#936A4C;
    --mountain:#7FB1AB; --mountain-light:#A3CEBD; --sea:#62B9DA; --sea-light:#C5EBF7;
    --building:#D5E7EF; --building-side:#8FB9D0; --window:#4E829E;
    --sun:#FFE9A8; --skin:#F5CBA9; --scarf:#B63149; --coat:#3779A7;
    --ground:#D8E7D9; --pavement:#EDF0E9; --cloud:#FFFFFF; --dark-cloud:#566D7D;
  }
  body { grid-template-rows:auto auto minmax(0,1fr) auto; }
  .topbar { padding:18px 36px 10px; }
  .topbar h1 { font-size:36px; }
  .goal { max-width:760px; }
  .weather-nav { display:flex; gap:16px; padding:0 36px 16px; }
  .weather-btn { flex:1; font-size:24px; min-height:64px; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; gap:12px; }
  .weather-btn .icon { font-size:30px; line-height:1; }
  .weather-btn[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .weather-btn:active,.btn:active { transform:scale(.96); }
  .layout { grid-template-columns:minmax(0,3fr) minmax(450px,2fr); padding:0 36px 8px; }
  #stage svg { width:100%; height:100%; display:block; }
  .scene-tag { position:absolute; left:24px; top:22px; background:var(--surface); border-radius:var(--radius); padding:8px 20px; font-size:24px; font-weight:700; box-shadow:var(--shadow); }
  .scene-note { position:absolute; bottom:20px; left:24px; margin:0; font-size:20px; padding:4px 12px; border-radius:var(--radius); background:var(--surface); color:var(--muted); }
  #panel { gap:10px; overflow:hidden; }
  #explanation { background:var(--surface); padding:17px 24px; gap:9px; flex:1; min-height:0; }
  .info-block { flex-shrink:0; }
  .info-block + .info-block { border-top:2px solid var(--border); padding-top:9px; }
  .info-block h2 { font-size:23px; margin:0 0 4px; color:var(--accent); }
  .info-block ul { list-style:none; padding:0; margin:0; }
  .info-block li { display:flex; gap:10px; font-size:22px; line-height:1.48; }
  .info-block li::before { content:"•"; color:var(--accent); font-weight:700; }
  #warning-name { font-weight:700; font-size:21px; line-height:1.45; margin:0; }
  #warning-detail { font-size:20px; line-height:1.4; color:var(--muted); margin:4px 0 0; }
  #controls { padding:0; background:transparent; border:none; box-shadow:none; overflow:visible; flex-direction:row; align-items:center; gap:12px; flex-shrink:0; }
  #controls .btn { min-width:170px; }
  .live-readout { margin:0; font-size:20px; color:var(--muted); }
  .caption-bar { display:flex; justify-content:center; align-items:center; min-height:55px; font-size:23px; font-weight:700; color:var(--accent); }
  svg .outline { stroke:var(--fg); stroke-width:3; stroke-linecap:round; fill:none; }
  svg .leaf { fill:var(--leaf); }
  svg .leaf-light { fill:var(--leaf-light); }
  svg .building { fill:var(--building); }
  svg .side { fill:var(--building-side); }
  svg .windows { fill:var(--window); }
  #rain { opacity:0; }
  #umbrella,#coat,#indoor,#breath,#mist { display:none; }
  @media (min-height:850px) {
    #explanation { padding:28px; gap:22px; }
    .info-block h2 { font-size:27px; margin-bottom:10px; }
    .info-block li { font-size:25px; line-height:1.7; }
    #warning-name { font-size:24px; }
    #warning-detail { font-size:22px; }
  }
  @media (max-width:1050px) {
    .topbar { padding:14px 24px 10px; }
    .topbar .goal { max-width:540px; }
    .layout { grid-template-columns:minmax(0,1fr) minmax(390px,1fr); padding:0 24px 8px; gap:16px; }
    .weather-nav { padding-left:24px; padding-right:24px; }
    #explanation { padding:14px 18px; }
    .info-block li { font-size:22px; }
    .topbar .btn { padding:10px 15px; }
  }
  @media (min-width:701px) and (max-height:800px) {
    .topbar { padding-top:14px; padding-bottom:8px; }
    .weather-nav { padding-bottom:12px; }
    .caption-bar { min-height:48px; }
    #explanation { padding-top:12px; padding-bottom:12px; gap:6px; }
    .info-block + .info-block { padding-top:6px; }
    .info-block h2 { line-height:1.2; margin-bottom:2px; }
    .info-block li { line-height:1.3; }
    #warning-name { line-height:1.3; }
    #warning-detail { line-height:1.3; }
  }
  @media (max-width:700px) {
    body { overflow:auto; height:auto; min-height:100%; }
    .topbar { flex-wrap:wrap; }
    .topbar .goal { display:none; }
    .topbar h1 { font-size:34px; }
    .weather-nav { display:grid; grid-template-columns:1fr 1fr; }
    .layout { grid-template-columns:1fr; }
    #stage { height:420px; }
    #panel { overflow:visible; }
    #explanation { padding:24px; }
    .caption-bar { padding:16px 24px; }
  }
</style>
<script>
/*
 * Viz kit — shared classroom helpers injected into every generated visual.
 * The coder model only writes the scene and calls these; the chrome (caption bar,
 * Prev/Next, Reset, fullscreen, keyboard) behaves the same on every page.
 */
(function () {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const resetHandlers = [];
    let steps = [];
    let currentStep = 0;
    let runningLoop = null;

    const byId = (id) => document.getElementById(id);

    const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    };

    // Layouts without a caption bar get a floating step navigator inside the stage.
    const ensureStepBar = () => {
        if (byId('caption-text')) return;
        const bar = element('div', 'viz-stepbar');
        bar.innerHTML = '<button class="btn" id="prev-btn" type="button">←</button>'
            + '<div class="text" id="caption-text"></div><span id="step-indicator"></span>'
            + '<button class="btn primary" id="next-btn" type="button">→</button>';
        byId('stage').append(bar);
    };

    const showStep = (index, direction) => {
        if (!steps.length) return;
        ensureStepBar();
        currentStep = Math.max(0, Math.min(steps.length - 1, index));
        const step = steps[currentStep];
        byId('caption-text').textContent = step.caption || '';
        byId('step-indicator').textContent = '步驟 ' + (currentStep + 1) + ' / ' + steps.length;
        byId('prev-btn').disabled = currentStep === 0;
        byId('next-btn').disabled = currentStep === steps.length - 1;
        if (typeof step.show === 'function') step.show(direction || 'jump');
    };

    const reset = () => {
        resetHandlers.forEach((handler) => handler());
        showStep(0, 'reset');
    };

    const toggleFullscreen = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());

    // Layouts without a control panel get a floating dock inside the stage.
    const controls = () => {
        if (!byId('controls')) {
            const dock = element('div', 'viz-dock');
            dock.id = 'controls';
            byId('stage').append(dock);
        }
        return byId('controls');
    };

    const field = (labelText) => {
        const wrapper = element('div', 'viz-field');
        wrapper.append(element('label', null, labelText));
        controls().append(wrapper);
        return wrapper;
    };

    window.Viz = {
        reducedMotion,

        /** Seconds to use for an animation: 0 when the viewer prefers reduced motion. */
        duration: (seconds) => (reducedMotion ? 0 : seconds),

        /** Read a style token, e.g. Viz.color('--accent'). */
        color: (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),

        /** The scene container and its current size. */
        stage: () => byId('stage'),
        size: () => ({ width: byId('stage').clientWidth, height: byId('stage').clientHeight }),
        onResize: (handler) => new ResizeObserver(() => handler(window.Viz.size())).observe(byId('stage')),

        /**
         * Register the teaching steps. Each item: caption (string) and show(direction).
         * show() must put the scene into that step's complete state so Prev and Reset work.
         */
        steps: (list) => {
            steps = list;
            showStep(0, 'start');
        },
        goTo: (index) => showStep(index, 'jump'),
        currentStep: () => currentStep,

        /** Run handler when Reset is pressed (before returning to step 1). */
        onReset: (handler) => resetHandlers.push(handler),

        button: (labelText, onClick, primary) => {
            const button = element('button', 'btn' + (primary ? ' primary' : ''), labelText);
            button.type = 'button';
            button.addEventListener('click', onClick);
            controls().append(button);
            return button;
        },

        slider: (options) => {
            const wrapper = field(options.label);
            const input = element('input');
            const output = element('output', 'viz-value');
            Object.assign(input, { type: 'range', min: options.min, max: options.max, step: options.step || 1, value: options.value });
            const render = () => { output.textContent = input.value + (options.unit ? ' ' + options.unit : ''); };
            input.addEventListener('input', () => { render(); options.onInput && options.onInput(Number(input.value)); });
            render();
            wrapper.append(input, output);
            resetHandlers.push(() => { input.value = options.value; render(); options.onInput && options.onInput(Number(options.value)); });
            return input;
        },

        toggle: (labelText, checked, onChange) => {
            const wrapper = element('label', 'viz-toggle');
            const input = element('input');
            input.type = 'checkbox';
            input.checked = !!checked;
            input.addEventListener('change', () => onChange && onChange(input.checked));
            wrapper.append(input, document.createTextNode(' ' + labelText));
            controls().append(wrapper);
            resetHandlers.push(() => { input.checked = !!checked; onChange && onChange(input.checked); });
            return input;
        },

        /**
         * Make an element draggable onto drop targets (touch and mouse).
         * options: targets (elements), onDrop(target, element) returns true to accept; rejected drops spring back.
         */
        draggable: (node, options) => {
            let startX = 0, startY = 0, originX = 0, originY = 0;
            node.style.touchAction = 'none';
            node.style.cursor = 'grab';
            node.addEventListener('pointerdown', (event) => {
                node.setPointerCapture(event.pointerId);
                startX = event.clientX; startY = event.clientY;
                const transform = new DOMMatrixReadOnly(getComputedStyle(node).transform);
                originX = transform.m41; originY = transform.m42;
                node.style.zIndex = 10;
                node.style.cursor = 'grabbing';
            });
            node.addEventListener('pointermove', (event) => {
                if (!node.hasPointerCapture(event.pointerId)) return;
                node.style.transform = 'translate(' + (originX + event.clientX - startX) + 'px,' + (originY + event.clientY - startY) + 'px)';
            });
            node.addEventListener('pointerup', (event) => {
                node.releasePointerCapture(event.pointerId);
                node.style.cursor = 'grab';
                const box = node.getBoundingClientRect();
                const centerX = box.left + box.width / 2, centerY = box.top + box.height / 2;
                const target = (options.targets || []).find((candidate) => {
                    const area = candidate.getBoundingClientRect();
                    return centerX > area.left && centerX < area.right && centerY > area.top && centerY < area.bottom;
                });
                const accepted = target && options.onDrop ? options.onDrop(target, node) !== false : false;
                if (!accepted) {
                    node.style.transition = reducedMotion ? 'none' : 'transform .35s cubic-bezier(.34,1.56,.64,1)';
                    node.style.transform = 'translate(' + originX + 'px,' + originY + 'px)';
                    setTimeout(() => { node.style.transition = ''; }, 400);
                }
            });
        },

        /** Short star burst for a right answer, centred on an element (or the stage). */
        celebrate: (node) => {
            const area = (node || byId('stage')).getBoundingClientRect();
            const colours = (window.Viz.color('--palette') || '#FFD166').split(',').map((colour) => colour.trim());
            for (let i = 0; i < (reducedMotion ? 0 : 18); i++) {
                const star = element('span', 'viz-star', '★');
                star.style.left = area.left + area.width / 2 + 'px';
                star.style.top = area.top + area.height / 2 + 'px';
                star.style.color = colours[i % colours.length];
                document.body.append(star);
                const angle = (Math.PI * 2 * i) / 18, distance = 80 + Math.random() * 90;
                star.animate([
                    { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
                    { transform: 'translate(calc(-50% + ' + Math.cos(angle) * distance + 'px), calc(-50% + ' + Math.sin(angle) * distance + 'px)) scale(1.2)', opacity: 0 },
                ], { duration: 900, easing: 'cubic-bezier(.22,1,.36,1)' }).onfinish = () => star.remove();
            }
            window.Viz.hint('做得好！', 'ok');
        },

        /** Gentle message over the stage, e.g. Viz.hint('再試一次') for a wrong answer. */
        hint: (text, tone) => {
            const toast = element('div', 'viz-hint' + (tone === 'ok' ? ' ok' : ''), text);
            byId('stage').append(toast);
            setTimeout(() => toast.remove(), 1800);
        },

        /** Update the game HUD (game layout) or a floating badge: Viz.score(3), Viz.round(2, 5). */
        score: (value) => { const target = byId('hud-score'); if (target) target.textContent = value; },
        round: (current, total) => { const target = byId('hud-round'); if (target) target.textContent = current + ' / ' + total; },

        /** requestAnimationFrame loop that pauses when the tab is hidden; Space toggles it. */
        loop: (frame) => {
            let last = performance.now(), paused = false;
            const tick = (now) => {
                if (!paused && !document.hidden) frame(Math.min(0.05, (now - last) / 1000), now / 1000);
                last = now;
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            runningLoop = { pause: () => { paused = true; }, play: () => { paused = false; }, toggle: () => { paused = !paused; }, isPaused: () => paused };
            return runningLoop;
        },
    };

    document.addEventListener('DOMContentLoaded', () => {
        const style = element('style');
        style.textContent = '.viz-field{display:flex;flex-direction:column;gap:6px}.viz-value{font-weight:700;color:var(--accent)}'
            + '.viz-toggle{display:flex;align-items:center;gap:10px;min-height:56px;font-weight:600}.viz-toggle input{width:28px;height:28px;accent-color:var(--accent)}'
            + '.viz-star{position:fixed;pointer-events:none;font-size:28px;z-index:50}'
            + '.viz-hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:var(--surface);color:var(--fg);border:2px solid var(--warn);font-weight:700;box-shadow:var(--shadow);z-index:20}'
            + '.viz-hint.ok{border-color:var(--ok)}.btn:disabled{opacity:.4;cursor:default}'
            + '.viz-stepbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:8px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-weight:600;z-index:15}'
            + '.viz-stepbar .text{padding:0 6px}.viz-stepbar #step-indicator{color:var(--muted);white-space:nowrap}'
            + '.viz-dock{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:10px;max-width:300px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);z-index:15}';
        document.head.append(style);

    });

    // One delegated listener, so chrome buttons work whether they come from the skeleton or are created later.
    document.addEventListener('click', (event) => {
        const button = event.target.closest && event.target.closest('#prev-btn, #next-btn, #reset-btn, #fullscreen-btn');
        if (!button) return;
        if (button.id === 'prev-btn') showStep(currentStep - 1, 'back');
        if (button.id === 'next-btn') showStep(currentStep + 1, 'forward');
        if (button.id === 'reset-btn') reset();
        if (button.id === 'fullscreen-btn') toggleFullscreen();
    });

    document.addEventListener('keydown', (event) => {
        if (event.target.closest && event.target.closest('input, textarea')) return;
        if (event.key === 'ArrowRight') showStep(currentStep + 1, 'forward');
        if (event.key === 'ArrowLeft') showStep(currentStep - 1, 'back');
        if (event.key === 'r' || event.key === 'R') reset();
        if (event.key === 'f' || event.key === 'F') toggleFullscreen();
        if (event.key === ' ' && runningLoop) { event.preventDefault(); runningLoop.toggle(); }
    });
})();

</script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>認識香港的天氣</h1>
      <p class="goal">認識天氣特徵、安全應對方法及天文台警告信號</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="reset-btn" type="button">↺ 重新開始</button>
    <button class="btn" id="fullscreen-btn" type="button" aria-label="全螢幕 (F)">全螢幕</button>
  </header>
  <nav class="weather-nav" aria-label="選擇天氣">
    <button class="btn weather-btn" type="button" data-weather="sunny" aria-pressed="true"><span class="icon" aria-hidden="true">☀</span>晴天</button>
    <button class="btn weather-btn" type="button" data-weather="rain" aria-pressed="false"><span class="icon" aria-hidden="true">☂</span>下雨</button>
    <button class="btn weather-btn" type="button" data-weather="typhoon" aria-pressed="false"><span class="icon" aria-hidden="true">≋</span>颱風</button>
    <button class="btn weather-btn" type="button" data-weather="cold" aria-pressed="false"><span class="icon" aria-hidden="true">❄</span>寒冷</button>
  </nav>
  <div class="layout">
    <main id="stage" class="card" aria-label="香港天氣插畫">
      <svg id="scene" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="獅子山、維港、高樓、樹木和小學生隨天氣變化的示意圖">
        <defs>
          <linearGradient id="sky-gradient" x2="0" y2="1">
            <stop id="sky-top" stop-color="var(--sky)"/>
            <stop id="sky-bottom" offset="1" stop-color="var(--surface)"/>
          </linearGradient>
          <linearGradient id="sea-gradient" x2="0" y2="1"><stop stop-color="var(--sea)"/><stop offset="1" stop-color="var(--sea-light)"/></linearGradient>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="0" dy="7" stdDeviation="4" flood-color="var(--fg)" flood-opacity=".15"/>
          </filter>
          <pattern id="window-pattern" width="23" height="27" patternUnits="userSpaceOnUse">
            <rect class="windows" x="6" y="7" width="10" height="13" rx="3"/>
          </pattern>
          <g id="cloud-shape">
            <path d="M-75 16C-106 13-103-25-73-27C-77-64-20-76 0-44C23-66 64-48 64-20C102-24 110 20 75 25H-65Z"/>
          </g>
        </defs>
        <rect width="800" height="600" fill="url(#sky-gradient)"/>

        </g>
        <g id="small-tree" transform="translate(728 464) scale(.63)" filter="url(#soft-shadow)">
          <path d="M-8 20L-5-80H10L12 20Z" fill="var(--trunk)"/>

        </g>
        <g id="indoor">
          <rect x="460" y="360" width="219" height="206" rx="20" fill="var(--surface)" filter="url(#soft-shadow)"/>
          <rect x="479" y="379" width="180" height="148" rx="12" fill="var(--building-side)"/>
          <rect x="490" y="391" width="158" height="126" rx="6" fill="var(--cold-sky)"/>

            <path d="M-17 34H18L16 45H-16Z" fill="var(--accent)"/>

          </g>
          <g id="coat">
            <path d="M-19-19Q0-25 19-19L32 0L28 26L18 24L19 44H-19L-18 24L-28 26L-32 0Z" fill="var(--coat)" filter="url(#soft-shadow)"/>
            <path d="M0-14V42" stroke="var(--sea-light)" stroke-width="3"/>
            <path d="M-18-16Q0-3 18-16" fill="none" stroke="var(--scarf)" stroke-width="12" stroke-linecap="round"/>
            <path d="M13-12L12 17L24 20L25-10Z" fill="var(--scarf)"/>
            <circle cx="6" cy="14" r="2.5" fill="var(--surface)"/><circle cx="6" cy="28" r="2.5" fill="var(--surface)"/>
          </g>

          <circle cx="-9" cy="-43" r="2.8" fill="var(--fg)"/><circle cx="9" cy="-43" r="2.8" fill="var(--fg)"/>

            <path d="M32-86V14Q32 31 21 24" fill="none" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/>
            <path d="M-34-84Q30-179 99-84Q81-98 64-84Q48-98 31-84Q15-98-1-84Q-17-98-34-84Z" fill="var(--sun)" filter="url(#soft-shadow)"/>

          </g>

        <g id="window-front" style="display:none" stroke="var(--surface)" stroke-width="9" fill="none">
          <path d="M570 389V518M489 452H650"/><rect x="486" y="387" width="166" height="134" rx="6"/>
        </g>
        <g id="mist" stroke="var(--surface)" stroke-width="12" stroke-linecap="round" fill="none" opacity=".35">
          <path d="M220 338Q290 318 370 339M390 294Q475 271 555 293M25 420Q105 400 182 420"/>
        </g>
      </svg>
      <div class="scene-tag" id="scene-tag">☀ 晴天</div>
      <p class="scene-note">示意圖（比例不準確）</p>
    </main>
    <aside id="panel" aria-label="天氣資料">
      <section id="explanation" class="card" aria-live="polite">
        <div class="info-block">
          <h2>天氣特徵</h2>
          <ul id="features"></ul>
        </div>
        <div class="info-block">
          <h2>安全提示</h2>
          <ul id="safety"></ul>
        </div>
        <div class="info-block">
          <h2>香港天文台｜可能發出的警告</h2>
          <p id="warning-name"></p>
          <p id="warning-detail"></p>
        </div>
      </section>
      <div id="controls" class="card">
        <button class="btn" id="play-btn" type="button" aria-pressed="false">Ⅱ 暫停動畫</button>
        <p class="live-readout" id="readout">風雨動態：晴天</p>
      </div>
    </aside>
  </div>
  <footer class="caption-bar">出門前記得看天文台預報！</footer>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const animation = typeof gsap !== 'undefined';
  if (animation && typeof Draggable !== 'undefined' && typeof MotionPathPlugin !== 'undefined') gsap.registerPlugin(Draggable, MotionPathPlugin);
  const Viz = window.Viz || {
    duration: seconds => reduced ? 0 : seconds,
    reducedMotion: reduced,
    loop(handler) {
      let last = 0;
      function frame(t) {
        const dt = last ? Math.min((t-last)/1000,.05) : 0;
        last=t;
        if (!document.hidden) handler(dt,t/1000);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  };
  const data = {
    sunny: {
      name:'晴天', icon:'☀', sky:'--sky', cloud:'--cloud',
      features:['陽光充足，天空明亮','雲量較少','炎熱日子容易流汗'],
      safety:['戴帽及塗防曬用品','多喝水，適時到陰涼處休息','避免長時間在烈日下活動'],
      warning:'酷熱天氣警告',
      detail:'通常在氣溫高達 33°C 或以上時發出；晴天不一定酷熱。'
    },
    rain: {
      name:'下雨', icon:'☂', sky:'--rain-sky', cloud:'--dark-cloud',
      features:['烏雲較多，天空灰暗','雨點落下，地面濕滑','大雨可能令低窪地方水浸'],
      safety:['帶備雨傘或雨衣','慢慢走，留意濕滑地面','遠離水浸地方及河道'],
      warning:'暴雨警告信號（黃／紅／黑）',
      detail:'黃色／紅色／黑色：每小時雨量超過 30／50／70 毫米，且可能持續。'
    },
    typhoon: {
      name:'颱風', icon:'≋', sky:'--storm-sky', cloud:'--dark-cloud',
      features:['風勢強勁，樹木搖動','常伴隨大雨','海浪湧起，海面危險'],
      safety:['留在安全室內，遠離窗戶','遠離岸邊，切勿觀浪','留意最新警告及停課安排'],
      warning:'熱帶氣旋警告信號（一號／三號／八號或以上）',
      detail:'信號只有一號、三號、八號、九號、十號；並非逐號順序發出。'
    },
    cold: {
      name:'寒冷', icon:'❄', sky:'--cold-sky', cloud:'--cloud',
      features:['氣溫低，感到寒冷','冷風令身體更易散熱','天氣可能乾燥'],
      safety:['穿上外套，戴圍巾保暖','關心長者及有需要的人','使用暖爐時保持空氣流通'],
      warning:'寒冷天氣警告',
      detail:'通常在市區氣溫預測降至 12°C 或以下時發出。'
    }
  };
  const css = getComputedStyle(document.documentElement);
  const color = token => css.getPropertyValue(token).trim();
  let weather='sunny', paused=false, elapsed=0, treeTween=null;
  const cloudEls=Array.from(document.querySelectorAll('.cloud'));
  const clouds=[
    {x:156,y:140,s:.85},{x:406,y:100,s:.7},{x:752,y:180,s:1.15},{x:-140,y:85,s:1}
  ];
  const rain=[];
  for(let i=0;i<105;i++){
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    const x=(i*137)%1050-150, y=(i*83)%470;
    line.setAttribute('x1',x);line.setAttribute('y1',y);
    line.setAttribute('x2',x+13);line.setAttribute('y2',y+13);
    $('rain').appendChild(line);rain.push({el:line,x,y});
  }
  function tween(el, vars, seconds, ease='power1.out'){
    if(animation) return gsap.to(el,{...vars,duration:Viz.duration(seconds),ease,overwrite:true});
    if(vars.attr) Object.entries(vars.attr).forEach(([k,v])=>el.setAttribute(k,v));
    if(vars.opacity !== undefined) el.style.opacity=vars.opacity;
    if(vars.rotation !== undefined) el.style.transform=`rotate(${vars.rotation}deg)`;
    return null;
  }
  function visible(id, yes){$(id).style.display=yes?'':'none';}
  function list(id, entries){
    $(id).replaceChildren(...entries.map(text=>{
      const li=document.createElement('li');li.textContent=text;return li;
    }));
  }
  function setWeather(next, initial=false){
    weather=next;
    const d=data[next];
    document.querySelectorAll('[data-weather]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.weather===next)));
    list('features',d.features);list('safety',d.safety);
    $('warning-name').textContent=d.warning;$('warning-detail').textContent=d.detail;
    $('scene-tag').textContent=d.icon+' '+d.name;
    $('readout').textContent='風雨動態：'+d.name;
    $('scene').setAttribute('aria-label',`香港${d.name}：${d.features.join('；')}`);
    if(treeTween) { treeTween.kill();treeTween=null; }
    if(animation) gsap.killTweensOf($('tree'));
    const storm=next==='typhoon', rainy=next==='rain', cold=next==='cold';
    tween($('sky-top'),{attr:{'stop-color':color(d.sky)}},initial?0:(storm?.3:.5));
    tween($('sky-bottom'),{attr:{'stop-color':color(storm?'--rain-sky':cold?'--cold-sky':'--surface')}},initial?0:.5);
    tween($('clouds'),{attr:{fill:color(d.cloud)},opacity:next==='sunny'?.8:1},initial?0:.4);
    tween($('sun'),{opacity:next==='sunny'?1:0},initial?0:.4);
    tween($('rain'),{opacity:rainy?.85:storm?.55:0},initial?0:.4);
    tween($('skyline'),{opacity:cold?.78:1},initial?0:.4);
    document.documentElement.style.setProperty('--window',storm?color('--sun'):'#4E829E');
    document.documentElement.style.setProperty('--leaf',cold?'#598B8B':'#4D9470');
    document.documentElement.style.setProperty('--leaf-light',cold?'#99BEC1':'#86BD91');
    visible('umbrella',rainy);visible('coat',cold);visible('uniform',!cold);
    visible('indoor',storm);visible('window-front',storm);visible('mist',cold);visible('breath',cold);
    visible('ferry',!storm);
    $('person').setAttribute('transform',storm?'translate(570 480) scale(.72)':'translate(565 480)');
    $('person').style.transformOrigin='center center';
    if(cold && animation && !initial){
      gsap.fromTo($('coat'),{scale:.9,transformOrigin:'center center'},{scale:1,duration:Viz.duration(.4),ease:'back.out(1.7)',overwrite:true});
    }
    $('tree').style.transformBox='fill-box';
    $('tree').style.transformOrigin='bottom center';
    tween($('tree'),{rotation:storm?25:0},initial?0:.3);
    if(storm && animation && !reduced){
      treeTween=gsap.timeline({delay:Viz.duration(.3)});
      treeTween.to($('tree'),{rotation:12,duration:Viz.duration(.85),ease:'elastic.out(1, 0.5)'})
        .to($('tree'),{rotation:25,duration:Viz.duration(.85),ease:'elastic.out(1, 0.5)'})
        .repeat(-1);
      if(paused)treeTween.pause();
    }
    if(!initial && animation){
      gsap.fromTo($('explanation'),{y:8,opacity:.6},{y:0,opacity:1,duration:Viz.duration(.4),ease:'back.out(1.7)',overwrite:true});
    }
  }
  function playPause(force){
    paused=typeof force==='boolean'?force:!paused;
    $('play-btn').textContent=paused?'▶ 播放動畫':'Ⅱ 暫停動畫';
    $('play-btn').setAttribute('aria-pressed',String(paused));
    if(treeTween) paused?treeTween.pause():treeTween.resume();
  }
  document.querySelectorAll('[data-weather]').forEach(btn=>btn.addEventListener('click',()=>setWeather(btn.dataset.weather)));
  $('play-btn').addEventListener('click',()=>playPause());
  function reset(){
    elapsed=0;
    clouds.forEach((c,i)=>c.x=[156,406,752,-140][i]);
    playPause(false);setWeather('sunny',true);
    cloudEls.forEach((el,i)=>el.setAttribute('transform',`translate(${clouds[i].x} ${clouds[i].y}) scale(${clouds[i].s})`));
    $('waves').setAttribute('transform','translate(0 0)');
  }
  $('reset-btn').addEventListener('click',reset);
  async function fullscreen(){
    try{
      if(document.fullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();}
      else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
    }catch(e){$('fullscreen-btn').textContent='全螢幕未能使用';}
  }
  $('fullscreen-btn').addEventListener('click',fullscreen);
  document.addEventListener('fullscreenchange',()=>{$('fullscreen-btn').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕';});
  document.addEventListener('keydown',e=>{
    if(e.target.closest('button,input') && e.code==='Space')return;
    if(e.code==='Space'){e.preventDefault();playPause();}
    else if(e.key.toLowerCase()==='r')reset();
    else if(e.key.toLowerCase()==='f')fullscreen();
  });
  Viz.loop((dt)=>{
    if(paused || reduced)return;
    elapsed+=dt;
    const storm=weather==='typhoon', rainy=weather==='rain', cold=weather==='cold';
    const speed=storm?105:35;
    clouds.forEach((c,i)=>{
      c.x+=dt*speed;
      if(c.x>940)c.x=-160;
      cloudEls[i].setAttribute('transform',`translate(${c.x} ${c.y}) scale(${c.s})`);
    });
    if(rainy||storm){
      const offset=elapsed*(storm?285:190);
      rain.forEach(p=>{
        const y=(p.y+offset)%470-30;
        const x=((p.x+offset)%1050)-150;
        p.el.setAttribute('x1',x);p.el.setAttribute('y1',y);
        p.el.setAttribute('x2',x+13);p.el.setAttribute('y2',y+13);
      });
    }
    const waveY=storm?Math.sin(elapsed*3.2)*8:rainy?Math.sin(elapsed*2.2)*2:Math.sin(elapsed)*1.3;
    $('waves').setAttribute('transform',`translate(${Math.sin(elapsed)*(storm?15:3)} ${waveY})`);
    $('ferry').setAttribute('transform',`translate(342 ${415+Math.sin(elapsed*1.5)*2})`);
    if(cold){
      const phase=(elapsed%2.8)/2.8;
      $('breath').setAttribute('transform',`translate(${phase*18} ${-phase*6}) scale(${1+phase*.3})`);
      $('breath').style.opacity=String((1-phase)*.85);
      $('mist').setAttribute('transform',`translate(${Math.sin(elapsed*.4)*19} 0)`);
    }
  });
  setWeather('sunny',true);
});
</script>
