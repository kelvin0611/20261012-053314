<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>認識香港的天氣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&amp;family=Nunito:wght@400;700&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
<style>
  :root {
    --bg: #F7F3FF;
    --fg: #3A2340;
    --muted: #5B4A6B;
    --surface: #FFFFFF;
    --border: #E7E1EE;
    --accent: #6B3FA0;
    --accent-fg: #FFFFFF;
    --ok: #1F7A45;
    --warn: #C2185B;
    --palette: #FFD6E0, #C3F0CA, #B8E1FF, #FFE9A8;
    --radius: 30px;
    --shadow: 0 12px 0 -4px rgba(58,35,64,.10),0 18px 28px rgba(58,35,64,.14),inset 0 -4px 0 rgba(58,35,64,.06);
    --font-display: 'Fredoka','Noto Sans TC',sans-serif;
    --font-body: 'Nunito','Noto Sans TC',sans-serif;
    --gap: clamp(12px, 2vw, 24px);
    --sky: #91D9F4;
    --sky-deep: #458DBB;
    --sea: #48A9CA;
    --green: #59A96A;
    --leaf: #34865A;
    --sun: #FFD46A;
    --cloud: #FFFFFF;
    --cold: #DCEBFA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 22px; line-height: 1.5; overflow: hidden; }
  .topbar { display: flex; align-items: center; gap: var(--gap); padding: 14px calc(var(--gap) * 1.5); min-height: 100px; }
  .topbar h1 { font-family: var(--font-display); font-size: clamp(28px, 3vw, 42px); margin: 0; line-height: 1.15; white-space: nowrap; }
  .topbar .goal { color: var(--muted); margin: 4px 0 0; font-size: 18px; line-height: 1.25; }
  .topbar .spacer { flex: 1; }
  #stage { position: relative; min-height: 0; overflow: hidden; background: var(--surface); }
  .card { border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
  #controls { display: flex; flex-direction: column; gap: 14px; overflow: auto; padding: var(--gap); background: var(--surface); }
  .btn { font: 700 20px var(--font-body); min-height: 56px; padding: 10px 22px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  label { font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  .layout { display: grid; grid-template-columns: 3fr 2fr; gap: var(--gap); padding: 0 calc(var(--gap) * 1.5) 12px; min-height: 0; }
  #panel { display: flex; flex-direction: column; gap: 12px; overflow: hidden; min-height: 0; }
  #explanation { display: flex; flex: 1; min-height: 0; }
  .weather-tabs { display: flex; gap: 10px; align-items: center; }
  .weather-btn { min-width: 94px; padding-inline: 17px; white-space: nowrap; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
  .weather-btn:hover { transform: translateY(-2px); }
  .weather-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  #reset-btn, #fullscreen-btn { white-space: nowrap; padding-inline: 16px; }
  .scene-wrap { position: absolute; inset: 0; }
  .scene-svg { display: block; width: 100%; height: 100%; }
  .scene-label { position: absolute; left: 20px; top: 18px; z-index: 2; padding: 8px 16px; border-radius: 24px; background: rgba(255,255,255,.88); color: var(--fg); font-size: 18px; font-weight: 700; box-shadow: var(--shadow); }
  .scene-note { position: absolute; right: 20px; bottom: 15px; z-index: 2; padding: 5px 12px; border-radius: 18px; color: var(--muted); background: rgba(255,255,255,.82); font-size: 15px; }
  .info-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px 22px; display: flex; flex-direction: column; min-height: 0; width: 100%; }
  .info-head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
  .weather-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--cold); font-size: 29px; flex: 0 0 auto; }
  .info-head h2 { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1.1; }
  .info-head p { margin: 2px 0 0; color: var(--muted); font-size: 17px; line-height: 1.25; }
  .info-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px 0; }
  .info-section h3 { font-size: 21px; margin: 0 0 5px; line-height: 1.25; color: var(--accent); }
  .info-section ul { padding-left: 21px; margin: 0; font-size: 18px; line-height: 1.4; }
  .info-section li { margin: 0 0 4px; }
  .warning-box { margin-top: auto; padding: 12px 14px; border-radius: 20px; background: var(--cold); }
  .warning-box h3 { font-size: 20px; margin: 0 0 3px; line-height: 1.3; }
  .warning-name { font-size: 20px; line-height: 1.3; font-weight: 700; }
  .warning-detail { color: var(--muted); font-size: 16px; line-height: 1.3; margin-top: 4px; }
  #controls { flex: 0 0 auto; min-height: 60px; justify-content: center; padding: 10px 16px; border-radius: 22px; }
  .source-note { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.35; }
  .reminder { margin: 0; min-height: 46px; display: grid; place-items: center; text-align: center; background: var(--sky-deep); color: var(--surface); font-size: 22px; font-weight: 700; letter-spacing: .03em; }
  #sky-bg { transition: fill .5s ease; }
  .sun-rays { transform-box: fill-box; transform-origin: center; animation: glow 3s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .55; transform: scale(1.08); } }
  .student-variant { display: none; }
  #rain { opacity: 0; pointer-events: none; }
  .building-light { opacity: 0; }
  #stage[data-weather="typhoon"] .building-light { opacity: .8; }
  .wave-line { transform-box: fill-box; transform-origin: center; }
  #stage[data-weather="rain"] .wave-line { animation: ripple 1.8s ease-in-out infinite; }
  #stage[data-weather="typhoon"] .wave-line { animation: ripple .7s ease-in-out infinite; }
  @keyframes ripple { 50% { transform: scaleX(1.18); opacity: .4; } }
  .breath { opacity: 0; }
  #stage[data-weather="cold"] .breath { animation: breath 2s ease-out infinite; }
  @keyframes breath { 0% { opacity: 0; transform: translateX(0) scale(.6); } 35% { opacity: .8; } 100% { opacity: 0; transform: translateX(28px) scale(1.3); } }
  @media (max-width: 1100px) {
    .topbar { gap: 12px; }
    .topbar .goal { display: none; }
    .weather-tabs { gap: 6px; }
    .weather-btn { min-width: 78px; padding-inline: 10px; }
    #reset-btn, #fullscreen-btn { padding-inline: 12px; }
    .info-card { padding: 16px; }
    .info-columns { gap: 8px; }
    .info-section ul { font-size: 17px; }
  }
  @media (max-width: 900px) {
    html, body { height: auto; min-height: 100%; }
    body { display: block; overflow: auto; }
    .topbar { flex-wrap: wrap; padding: 14px 18px; }
    .topbar > div:first-child { flex: 1 1 100%; }
    .topbar .spacer { display: none; }
    .weather-tabs { order: 3; flex: 1 1 100%; }
    .weather-btn { flex: 1; }
    .layout { grid-template-columns: 1fr; padding: 0 16px 14px; }
    #stage { min-height: 55vw; }
    #panel { overflow: visible; }
    #explanation { min-height: 450px; }
    .info-card { min-height: 450px; }
    .reminder { min-height: 56px; }
    #reset-btn, #fullscreen-btn { min-height: 50px; }
  }
  @media (max-width: 520px) {
    .info-columns { grid-template-columns: 1fr; }
    .info-card { min-height: 0; }
    #explanation { min-height: 0; }
    .warning-box { margin-top: 4px; }
    .weather-btn { font-size: 17px; padding-inline: 4px; min-width: 0; }
    .scene-note { font-size: 12px; }
  }
</style>
<script>
/*
 * Viz kit — shared classroom helpers injected into every generated visual.
 * The coder model only writes the scene and calls these; the chrome (caption bar,
 * Prev/Next, Reset, fullscreen, keyboard) behaves the same on every page.
 */
(function () {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const resetHandlers = [];
    let steps = [];
    let currentStep = 0;
    let runningLoop = null;

    const byId = (id) => document.getElementById(id);

    const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    };

    // Layouts without a caption bar get a floating step navigator inside the stage.
    const ensureStepBar = () => {
        if (byId('caption-text')) return;
        const bar = element('div', 'viz-stepbar');
        bar.innerHTML = '<button class="btn" id="prev-btn" type="button">←</button>'
            + '<div class="text" id="caption-text"></div><span id="step-indicator"></span>'
            + '<button class="btn primary" id="next-btn" type="button">→</button>';
        byId('stage').append(bar);
    };

    const showStep = (index, direction) => {
        if (!steps.length) return;
        ensureStepBar();
        currentStep = Math.max(0, Math.min(steps.length - 1, index));
        const step = steps[currentStep];
        byId('caption-text').textContent = step.caption || '';
        byId('step-indicator').textContent = '步驟 ' + (currentStep + 1) + ' / ' + steps.length;
        byId('prev-btn').disabled = currentStep === 0;
        byId('next-btn').disabled = currentStep === steps.length - 1;
        if (typeof step.show === 'function') step.show(direction || 'jump');
    };

    const reset = () => {
        resetHandlers.forEach((handler) => handler());
        showStep(0, 'reset');
    };

    const toggleFullscreen = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());

    // Layouts without a control panel get a floating dock inside the stage.
    const controls = () => {
        if (!byId('controls')) {
            const dock = element('div', 'viz-dock');
            dock.id = 'controls';
            byId('stage').append(dock);
        }
        return byId('controls');
    };

    const field = (labelText) => {
        const wrapper = element('div', 'viz-field');
        wrapper.append(element('label', null, labelText));
        controls().append(wrapper);
        return wrapper;
    };

    window.Viz = {
        reducedMotion,

        /** Seconds to use for an animation: 0 when the viewer prefers reduced motion. */
        duration: (seconds) => (reducedMotion ? 0 : seconds),

        /** Read a style token, e.g. Viz.color('--accent'). */
        color: (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),

        /** The scene container and its current size. */
        stage: () => byId('stage'),
        size: () => ({ width: byId('stage').clientWidth, height: byId('stage').clientHeight }),
        onResize: (handler) => new ResizeObserver(() => handler(window.Viz.size())).observe(byId('stage')),

        /**
         * Register the teaching steps. Each item: caption (string) and show(direction).
         * show() must put the scene into that step's complete state so Prev and Reset work.
         */
        steps: (list) => {
            steps = list;
            showStep(0, 'start');
        },
        goTo: (index) => showStep(index, 'jump'),
        currentStep: () => currentStep,

        /** Run handler when Reset is pressed (before returning to step 1). */
        onReset: (handler) => resetHandlers.push(handler),

        button: (labelText, onClick, primary) => {
            const button = element('button', 'btn' + (primary ? ' primary' : ''), labelText);
            button.type = 'button';
            button.addEventListener('click', onClick);
            controls().append(button);
            return button;
        },

        slider: (options) => {
            const wrapper = field(options.label);
            const input = element('input');
            const output = element('output', 'viz-value');
            Object.assign(input, { type: 'range', min: options.min, max: options.max, step: options.step || 1, value: options.value });
            const render = () => { output.textContent = input.value + (options.unit ? ' ' + options.unit : ''); };
            input.addEventListener('input', () => { render(); options.onInput && options.onInput(Number(input.value)); });
            render();
            wrapper.append(input, output);
            resetHandlers.push(() => { input.value = options.value; render(); options.onInput && options.onInput(Number(options.value)); });
            return input;
        },

        toggle: (labelText, checked, onChange) => {
            const wrapper = element('label', 'viz-toggle');
            const input = element('input');
            input.type = 'checkbox';
            input.checked = !!checked;
            input.addEventListener('change', () => onChange && onChange(input.checked));
            wrapper.append(input, document.createTextNode(' ' + labelText));
            controls().append(wrapper);
            resetHandlers.push(() => { input.checked = !!checked; onChange && onChange(input.checked); });
            return input;
        },

        /**
         * Make an element draggable onto drop targets (touch and mouse).
         * options: targets (elements), onDrop(target, element) returns true to accept; rejected drops spring back.
         */
        draggable: (node, options) => {
            let startX = 0, startY = 0, originX = 0, originY = 0;
            node.style.touchAction = 'none';
            node.style.cursor = 'grab';
            node.addEventListener('pointerdown', (event) => {
                node.setPointerCapture(event.pointerId);
                startX = event.clientX; startY = event.clientY;
                const transform = new DOMMatrixReadOnly(getComputedStyle(node).transform);
                originX = transform.m41; originY = transform.m42;
                node.style.zIndex = 10;
                node.style.cursor = 'grabbing';
            });
            node.addEventListener('pointermove', (event) => {
                if (!node.hasPointerCapture(event.pointerId)) return;
                node.style.transform = 'translate(' + (originX + event.clientX - startX) + 'px,' + (originY + event.clientY - startY) + 'px)';
            });
            node.addEventListener('pointerup', (event) => {
                node.releasePointerCapture(event.pointerId);
                node.style.cursor = 'grab';
                const box = node.getBoundingClientRect();
                const centerX = box.left + box.width / 2, centerY = box.top + box.height / 2;
                const target = (options.targets || []).find((candidate) => {
                    const area = candidate.getBoundingClientRect();
                    return centerX > area.left && centerX < area.right && centerY > area.top && centerY < area.bottom;
                });
                const accepted = target && options.onDrop ? options.onDrop(target, node) !== false : false;
                if (!accepted) {
                    node.style.transition = reducedMotion ? 'none' : 'transform .35s cubic-bezier(.34,1.56,.64,1)';
                    node.style.transform = 'translate(' + originX + 'px,' + originY + 'px)';
                    setTimeout(() => { node.style.transition = ''; }, 400);
                }
            });
        },

        /** Short star burst for a right answer, centred on an element (or the stage). */
        celebrate: (node) => {
            const area = (node || byId('stage')).getBoundingClientRect();
            const colours = (window.Viz.color('--palette') || '#FFD166').split(',').map((colour) => colour.trim());
            for (let i = 0; i < (reducedMotion ? 0 : 18); i++) {
                const star = element('span', 'viz-star', '★');
                star.style.left = area.left + area.width / 2 + 'px';
                star.style.top = area.top + area.height / 2 + 'px';
                star.style.color = colours[i % colours.length];
                document.body.append(star);
                const angle = (Math.PI * 2 * i) / 18, distance = 80 + Math.random() * 90;
                star.animate([
                    { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
                    { transform: 'translate(calc(-50% + ' + Math.cos(angle) * distance + 'px), calc(-50% + ' + Math.sin(angle) * distance + 'px)) scale(1.2)', opacity: 0 },
                ], { duration: 900, easing: 'cubic-bezier(.22,1,.36,1)' }).onfinish = () => star.remove();
            }
            window.Viz.hint('做得好！', 'ok');
        },

        /** Gentle message over the stage, e.g. Viz.hint('再試一次') for a wrong answer. */
        hint: (text, tone) => {
            const toast = element('div', 'viz-hint' + (tone === 'ok' ? ' ok' : ''), text);
            byId('stage').append(toast);
            setTimeout(() => toast.remove(), 1800);
        },

        /** Update the game HUD (game layout) or a floating badge: Viz.score(3), Viz.round(2, 5). */
        score: (value) => { const target = byId('hud-score'); if (target) target.textContent = value; },
        round: (current, total) => { const target = byId('hud-round'); if (target) target.textContent = current + ' / ' + total; },

        /** requestAnimationFrame loop that pauses when the tab is hidden; Space toggles it. */
        loop: (frame) => {
            let last = performance.now(), paused = false;
            const tick = (now) => {
                if (!paused && !document.hidden) frame(Math.min(0.05, (now - last) / 1000), now / 1000);
                last = now;
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            runningLoop = { pause: () => { paused = true; }, play: () => { paused = false; }, toggle: () => { paused = !paused; }, isPaused: () => paused };
            return runningLoop;
        },
    };

    document.addEventListener('DOMContentLoaded', () => {
        const style = element('style');
        style.textContent = '.viz-field{display:flex;flex-direction:column;gap:6px}.viz-value{font-weight:700;color:var(--accent)}'
            + '.viz-toggle{display:flex;align-items:center;gap:10px;min-height:56px;font-weight:600}.viz-toggle input{width:28px;height:28px;accent-color:var(--accent)}'
            + '.viz-star{position:fixed;pointer-events:none;font-size:28px;z-index:50}'
            + '.viz-hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:var(--surface);color:var(--fg);border:2px solid var(--warn);font-weight:700;box-shadow:var(--shadow);z-index:20}'
            + '.viz-hint.ok{border-color:var(--ok)}.btn:disabled{opacity:.4;cursor:default}'
            + '.viz-stepbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:8px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-weight:600;z-index:15}'
            + '.viz-stepbar .text{padding:0 6px}.viz-stepbar #step-indicator{color:var(--muted);white-space:nowrap}'
            + '.viz-dock{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:10px;max-width:300px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);z-index:15}';
        document.head.append(style);

    });

    // One delegated listener, so chrome buttons work whether they come from the skeleton or are created later.
    document.addEventListener('click', (event) => {
        const button = event.target.closest && event.target.closest('#prev-btn, #next-btn, #reset-btn, #fullscreen-btn');
        if (!button) return;
        if (button.id === 'prev-btn') showStep(currentStep - 1, 'back');
        if (button.id === 'next-btn') showStep(currentStep + 1, 'forward');
        if (button.id === 'reset-btn') reset();
        if (button.id === 'fullscreen-btn') toggleFullscreen();
    });

    document.addEventListener('keydown', (event) => {
        if (event.target.closest && event.target.closest('input, textarea')) return;
        if (event.key === 'ArrowRight') showStep(currentStep + 1, 'forward');
        if (event.key === 'ArrowLeft') showStep(currentStep - 1, 'back');
        if (event.key === 'r' || event.key === 'R') reset();
        if (event.key === 'f' || event.key === 'F') toggleFullscreen();
        if (event.key === ' ' && runningLoop) { event.preventDefault(); runningLoop.toggle(); }
    });
})();

</script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>認識香港的天氣</h1>
      <p class="goal">認識天氣特徵、安全方法和天文台警告</p>
    </div>
    <nav class="weather-tabs" aria-label="選擇天氣">
      <button class="btn weather-btn" type="button" data-weather-button="sunny" aria-pressed="true">☀️ 晴天</button>
      <button class="btn weather-btn" type="button" data-weather-button="rain" aria-pressed="false">🌧️ 下雨</button>
      <button class="btn weather-btn" type="button" data-weather-button="typhoon" aria-pressed="false">🌀 颱風</button>
      <button class="btn weather-btn" type="button" data-weather-button="cold" aria-pressed="false">🧣 寒冷</button>
    </nav>
    <div class="spacer"></div>
    <button class="btn" id="reset-btn" type="button">↺ 重新開始</button>
    <button class="btn" id="fullscreen-btn" type="button" aria-label="全螢幕 (F)">全螢幕</button>
  </header>

  <div class="layout">
    <main id="stage" class="card" data-weather="sunny" aria-label="香港天氣插畫">
      <div class="scene-wrap">
        <div class="scene-label">香港天氣小天地</div>
        <svg class="scene-svg" viewBox="0 0 760 580" role="img" aria-label="獅子山、維港、中環高樓、樹木和小學生的香港插畫" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--sea)"/>
              <stop offset="1" stop-color="var(--sky-deep)"/>
            </linearGradient>
            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
              <feOffset dy="6"/>
              <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
              <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <clipPath id="sceneClip"><rect x="0" y="0" width="760" height="580" rx="30"/></clipPath>
          </defs>
          <g clip-path="url(#sceneClip)">
            <rect id="sky-bg" width="760" height="430" fill="var(--sky)"/>
            <circle class="sun-rays" cx="632" cy="104" r="66" fill="var(--sun)" opacity=".55"/>
            <circle id="sun" cx="632" cy="104" r="42" fill="var(--sun)" filter="url(#softShadow)"/>
            <g id="cloud-a" fill="var(--cloud)" filter="url(#softShadow)">
              <ellipse cx="190" cy="130" rx="60" ry="26"/><circle cx="162" cy="116" r="25"/><circle cx="194" cy="104" r="34"/><circle cx="226" cy="119" r="25"/>

    <aside id="panel" aria-label="天氣資料">
      <section id="explanation">
        <article class="info-card" aria-live="polite">
          <div class="info-head">
            <div class="weather-icon" id="weather-icon" aria-hidden="true">☀️</div>
            <div>
              <h2 id="weather-title">晴天</h2>
              <p id="weather-subtitle">陽光充沛，記得做好防曬！</p>
            </div>
          </div>
          <div class="info-columns">
            <section class="info-section">
              <h3>天氣特徵</h3>
              <ul id="features"></ul>
            </section>
            <section class="info-section">
              <h3>安全提示</h3>
              <ul id="safety"></ul>
            </section>
          </div>
          <section class="warning-box">
            <h3>香港天文台｜天文台警告信號</h3>
            <div class="warning-name" id="warning-name"></div>
            <div class="warning-detail" id="warning-detail"></div>
          </section>
        </article>
      </section>
      <div id="controls" class="card">
        <p class="source-note" id="source-note">酷熱天氣警告通常在氣溫高達 33°C 或以上時發出。</p>
      </div>
    </aside>
  </div>

  <footer class="reminder">出門前記得看天文台預報！</footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.gsap && window.Draggable && window.MotionPathPlugin) {
    gsap.registerPlugin(Draggable, MotionPathPlugin);
  }

  const stage = document.getElementById('stage');
  const sky = document.getElementById('sky-bg');
  const sun = document.getElementById('sun');
  const sunRays = document.querySelector('.sun-rays');
  const rain = document.getElementById('rain');
  const tree = document.getElementById('tree');
  const clouds = ['cloud-a', 'cloud-b', 'cloud-c'].map(id => document.getElementById(id));
  const variants = {
    sunny: document.getElementById('student-sunny'),
    rain: document.getElementById('student-rain'),
    typhoon: document.getElementById('student-typhoon'),
    cold: document.getElementById('student-cold')
  };

  const weatherData = {
    sunny: {
      icon: '☀️', title: '晴天', subtitle: '陽光充沛，記得做好防曬！',
      features: ['陽光普照，天空較少雲。', '日間氣溫可能較高。', '戶外活動時容易曬傷或中暑。'],
      safety: ['戴帽、穿防曬衣物及塗防曬用品。', '多喝水，避免長時間曝曬。', '感到不適時，立即到陰涼處休息。'],
      warning: '酷熱天氣警告',
      detail: '通常在氣溫高達 33°C 或以上時發出。'
    },
    rain: {
      icon: '🌧️', title: '下雨', subtitle: '帶備雨具，走路要小心！',
      features: ['雲層增厚，天色轉暗。', '雨水令路面濕滑，能見度下降。', '大雨時低窪地區可能水浸。'],
      safety: ['出門帶備雨傘或雨衣。', '小心慢行，避免在濕滑路面奔跑。', '遠離山坡、河道及積水地方。'],
      warning: '暴雨警告信號（黃色、紅色、黑色）',
      detail: '黃色、紅色、黑色三級；雨量每小時超過 30、50、70 毫米。'
    },
    typhoon: {
      icon: '🌀', title: '颱風', subtitle: '狂風巨浪時，留在安全地方！',
      features: ['熱帶氣旋帶來強風和大雨。', '海面風浪增大，岸邊十分危險。', '樹枝、招牌或物件可能被吹起。'],
      safety: ['遠離岸邊、海傍及低窪地區。', '留在室內，關好門窗。', '留意天文台及政府最新消息。'],
      warning: '熱帶氣旋警告信號（一號、三號、八號、九號、十號）',
      detail: '香港信號只有一號、三號、八號、九號及十號。'
    },
    cold: {
      icon: '🧣', title: '寒冷', subtitle: '添上衣物，記得關心身邊的人！',
      features: ['氣溫較低，天氣清涼或寒冷。', '天氣可能較乾燥，皮膚容易乾。', '長者和幼童較容易受寒冷影響。'],
      safety: ['穿上足夠保暖衣物和圍巾。', '注意保暖，避免長時間留在寒冷地方。', '關心長者及有需要的人。'],
      warning: '寒冷天氣警告',
      detail: '通常在市區氣溫預測降至 12°C 或以下時發出。'
    }
  };

  let currentWeather = 'sunny';
  let cloudTweens = [];
  let treeTween;
  const duration = seconds => window.Viz && typeof Viz.duration === 'function' ? Viz.duration(seconds) : (window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : seconds);

  function clearWeatherMotion() {
    cloudTweens.forEach(tween => tween && tween.kill());
    cloudTweens = [];
    if (treeTween) { treeTween.kill(); treeTween = null; }
    if (window.gsap) {
      gsap.killTweensOf([tree, rain, sky, sun, sunRays, ...clouds]);
      gsap.set(tree, { rotation: 0, transformOrigin: '50% 100%' });
      gsap.set(rain, { opacity: 0, y: 0 });
    }
  }

  function updateCard(key) {
    const data = weatherData[key];
    document.getElementById('weather-icon').textContent = data.icon;
    document.getElementById('weather-title').textContent = data.title;
    document.getElementById('weather-subtitle').textContent = data.subtitle;
    document.getElementById('features').innerHTML = data.features.map(item => '<li>' + item + '</li>').join('');
    document.getElementById('safety').innerHTML = data.safety.map(item => '<li>' + item + '</li>').join('');
    document.getElementById('warning-name').textContent = data.warning;
    document.getElementById('warning-detail').textContent = data.detail;
    document.getElementById('source-note').textContent = data.detail;
  }

  function showWeather(key) {
    if (!weatherData[key]) return;
    currentWeather = key;
    clearWeatherMotion();
    stage.dataset.weather = key;
    document.querySelectorAll('[data-weather-button]').forEach(button => {
      button.setAttribute('aria-pressed', button.dataset.weatherButton === key ? 'true' : 'false');
    });
    updateCard(key);

    Object.keys(variants).forEach(name => {
      variants[name].style.display = name === key ? 'inline' : 'none';
    });

    if (!window.gsap) {
      const colors = { sunny: 'var(--sky)', rain: 'var(--sky-deep)', typhoon: 'var(--muted)', cold: 'var(--cold)' };
      sky.setAttribute('fill', colors[key]);
      sun.style.display = key === 'sunny' ? '' : 'none';
      rain.style.opacity = key === 'rain' ? '0.85' : '0';
      return;
    }

    const skyColors = {
      sunny: '#91D9F4',
      rain: '#789DBA',
      typhoon: '#596779',
      cold: '#DCEBFA'
    };
    gsap.to(sky, { duration: duration(.5), attr: { fill: skyColors[key] }, ease: 'power2.inOut' });

    const sunny = key === 'sunny';
    gsap.to([sun, sunRays], { duration: duration(.35), opacity: sunny ? 1 : 0, scale: sunny ? 1 : .75, transformOrigin: '50% 50%', ease: 'power2.out' });

    const isStorm = key === 'typhoon';
    clouds.forEach((cloud, index) => {
      const target = isStorm ? 510 : 55;
      const speed = isStorm ? 1.5 : 10;
      cloudTweens.push(gsap.fromTo(cloud, { x: isStorm ? -220 : -25 }, {
        x: target + index * 35,
        duration: duration(speed),
        repeat: -1,
        yoyo: !isStorm,
        ease: isStorm ? 'none' : 'sine.inOut',
        delay: index * (isStorm ? .12 : .8)
      }));
    });

    if (key === 'rain') {
      gsap.fromTo(rain, { opacity: 0, y: -24 }, {
        opacity: .85, y: 0, duration: duration(.4), ease: 'power1.out',
        onComplete: () => gsap.to(rain, { y: 110, duration: duration(1.1), ease: 'none', repeat: -1 })
      });
    }
    if (isStorm) {
      treeTween = gsap.to(tree, {
        rotation: 25, duration: duration(.3), transformOrigin: '50% 100%',
        ease: 'back.out(1.7)',
        onComplete: () => {
          treeTween = gsap.to(tree, {
            rotation: -22, duration: duration(.42), transformOrigin: '50% 100%',
            ease: 'elastic.out(1, 0.5)', yoyo: true, repeat: -1
          });
        }
      });
    }
    if (key === 'cold') {
      gsap.fromTo(variants.cold, { scale: .9, transformOrigin: '50% 50%' }, {
        scale: 1, duration: duration(.4), ease: 'elastic.out(1, 0.5)'
      });
    }
  }

  document.querySelectorAll('[data-weather-button]').forEach(button => {
    button.addEventListener('click', () => showWeather(button.dataset.weatherButton));
  });

  document.getElementById('reset-btn').addEventListener('click', () => showWeather('sunny'));
  document.getElementById('fullscreen-btn').addEventListener('click', () => {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  });

  showWeather('sunny');
});
</script>
