<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索太陽系八大行星</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
<style>
  :root {
    --bg: #120E26;
    --fg: #FFFFFF;
    --muted: #D9D4EE;
    --surface: rgba(255,255,255,.10);
    --border: rgba(255,255,255,.28);
    --accent: #B79CFF;
    --accent-fg: #191136;
    --ok: #8BE8C0;
    --warn: #FFA893;
    --palette: #B79CFF, #7FE6E0, #FFD27F, #FF8FB1, #8BE8C0;
    --radius: 18px;
    --shadow: 0 20px 50px rgba(9,4,24,.45),inset 0 1px 0 rgba(255,255,255,.28);
    --font-display: 'Plus Jakarta Sans','Noto Sans TC',sans-serif;
    --font-body: 'Plus Jakarta Sans','Noto Sans TC',sans-serif;
    --gap: clamp(12px, 2vw, 24px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 22px; line-height: 1.5; overflow: hidden; }
  .topbar { display: flex; align-items: center; gap: var(--gap); padding: var(--gap) calc(var(--gap) * 1.5); }
  .topbar h1 { font-family: var(--font-display); font-size: clamp(28px, 3vw, 42px); margin: 0; line-height: 1.15; }
  .topbar .goal { color: var(--muted); margin: 0; font-size: 20px; }
  .topbar .spacer { flex: 1; }
  #stage { position: relative; min-height: 0; overflow: hidden; background: #090418; } /* Darker space background */
  .card { border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
  #controls { display: flex; flex-direction: column; gap: 14px; overflow: auto; padding: var(--gap); background: var(--surface); }
  .btn { font: 700 20px var(--font-body); min-height: 56px; padding: 10px 22px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--surface); color: var(--fg); cursor: pointer; transition: all 0.2s; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:hover { background: rgba(255,255,255,0.2); }
  .btn.primary:hover { background: #c8b3ff; }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  label { font-weight: 600; font-size: 20px;}
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  #stage { margin: 0 calc(var(--gap) * 1.5); }
  #controls { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; margin: var(--gap) calc(var(--gap) * 1.5); }

  /* Custom UI Overlays */
  .glass-panel {
    background: rgba(18, 14, 38, 0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    color: var(--fg);
  }
  #info-card {
    position: absolute;
    top: clamp(16px, 3vw, 32px);
    right: clamp(16px, 3vw, 32px);
    width: min(340px, 90vw);
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  #info-card h2 { margin: 0; font-size: 30px; color: var(--accent); display: flex; align-items: center; gap: 12px; }
  #info-card .order { font-size: 18px; color: #7FE6E0; font-weight: 700; background: rgba(127, 230, 224, 0.15); padding: 4px 12px; border-radius: 20px; display: inline-block; width: fit-content;}
  #info-card p { margin: 8px 0 0 0; font-size: 20px; color: var(--muted); line-height: 1.6; }
  
  #disclaimer {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
    background: rgba(0, 0, 0, 0.4);
    padding: 6px 12px;
    border-radius: 8px;
    pointer-events: none;
    z-index: 10;
  }

  .planet-label {
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.8);
    pointer-events: none;
    transform: translateY(-120%);
    opacity: 0.8;
  }

  /* Slider container layout */
  .slider-group {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    padding: 10px 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    min-width: 300px;
  }
</style>
<script>
/*
 * Viz kit — shared classroom helpers injected into every generated visual.
 * The coder model only writes the scene and calls these; the chrome (caption bar,
 * Prev/Next, Reset, fullscreen, keyboard) behaves the same on every page.
 */
(function () {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const resetHandlers = [];
    let steps = [];
    let currentStep = 0;
    let runningLoop = null;

    const byId = (id) => document.getElementById(id);

    const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    };

    // Layouts without a caption bar get a floating step navigator inside the stage.
    const ensureStepBar = () => {
        if (byId('caption-text')) return;
        const bar = element('div', 'viz-stepbar');
        bar.innerHTML = '<button class="btn" id="prev-btn" type="button">←</button>'
            + '<div class="text" id="caption-text"></div><span id="step-indicator"></span>'
            + '<button class="btn primary" id="next-btn" type="button">→</button>';
        byId('stage').append(bar);
    };

    const showStep = (index, direction) => {
        if (!steps.length) return;
        ensureStepBar();
        currentStep = Math.max(0, Math.min(steps.length - 1, index));
        const step = steps[currentStep];
        byId('caption-text').textContent = step.caption || '';
        byId('step-indicator').textContent = '步驟 ' + (currentStep + 1) + ' / ' + steps.length;
        byId('prev-btn').disabled = currentStep === 0;
        byId('next-btn').disabled = currentStep === steps.length - 1;
        if (typeof step.show === 'function') step.show(direction || 'jump');
    };

    const reset = () => {
        resetHandlers.forEach((handler) => handler());
        showStep(0, 'reset');
    };

    const toggleFullscreen = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());

    // Layouts without a control panel get a floating dock inside the stage.
    const controls = () => {
        if (!byId('controls')) {
            const dock = element('div', 'viz-dock');
            dock.id = 'controls';
            byId('stage').append(dock);
        }
        return byId('controls');
    };

    const field = (labelText) => {
        const wrapper = element('div', 'viz-field');
        wrapper.append(element('label', null, labelText));
        controls().append(wrapper);
        return wrapper;
    };

    window.Viz = {
        reducedMotion,

        /** Seconds to use for an animation: 0 when the viewer prefers reduced motion. */
        duration: (seconds) => (reducedMotion ? 0 : seconds),

        /** Read a style token, e.g. Viz.color('--accent'). */
        color: (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),

        /** The scene container and its current size. */
        stage: () => byId('stage'),
        size: () => ({ width: byId('stage').clientWidth, height: byId('stage').clientHeight }),
        onResize: (handler) => new ResizeObserver(() => handler(window.Viz.size())).observe(byId('stage')),

        /**
         * Register the teaching steps. Each item: caption (string) and show(direction).
         * show() must put the scene into that step's complete state so Prev and Reset work.
         */
        steps: (list) => {
            steps = list;
            showStep(0, 'start');
        },
        goTo: (index) => showStep(index, 'jump'),
        currentStep: () => currentStep,

        /** Run handler when Reset is pressed (before returning to step 1). */
        onReset: (handler) => resetHandlers.push(handler),

        button: (labelText, onClick, primary) => {
            const button = element('button', 'btn' + (primary ? ' primary' : ''), labelText);
            button.type = 'button';
            button.addEventListener('click', onClick);
            controls().append(button);
            return button;
        },

        slider: (options) => {
            const wrapper = field(options.label);
            const input = element('input');
            const output = element('output', 'viz-value');
            Object.assign(input, { type: 'range', min: options.min, max: options.max, step: options.step || 1, value: options.value });
            const render = () => { output.textContent = input.value + (options.unit ? ' ' + options.unit : ''); };
            input.addEventListener('input', () => { render(); options.onInput && options.onInput(Number(input.value)); });
            render();
            wrapper.append(input, output);
            resetHandlers.push(() => { input.value = options.value; render(); options.onInput && options.onInput(Number(options.value)); });
            return input;
        },

        toggle: (labelText, checked, onChange) => {
            const wrapper = element('label', 'viz-toggle');
            const input = element('input');
            input.type = 'checkbox';
            input.checked = !!checked;
            input.addEventListener('change', () => onChange && onChange(input.checked));
            wrapper.append(input, document.createTextNode(' ' + labelText));
            controls().append(wrapper);
            resetHandlers.push(() => { input.checked = !!checked; onChange && onChange(input.checked); });
            return input;
        },

        /**
         * Make an element draggable onto drop targets (touch and mouse).
         * options: targets (elements), onDrop(target, element) returns true to accept; rejected drops spring back.
         */
        draggable: (node, options) => {
            let startX = 0, startY = 0, originX = 0, originY = 0;
            node.style.touchAction = 'none';
            node.style.cursor = 'grab';
            node.addEventListener('pointerdown', (event) => {
                node.setPointerCapture(event.pointerId);
                startX = event.clientX; startY = event.clientY;
                const transform = new DOMMatrixReadOnly(getComputedStyle(node).transform);
                originX = transform.m41; originY = transform.m42;
                node.style.zIndex = 10;
                node.style.cursor = 'grabbing';
            });
            node.addEventListener('pointermove', (event) => {
                if (!node.hasPointerCapture(event.pointerId)) return;
                node.style.transform = 'translate(' + (originX + event.clientX - startX) + 'px,' + (originY + event.clientY - startY) + 'px)';
            });
            node.addEventListener('pointerup', (event) => {
                node.releasePointerCapture(event.pointerId);
                node.style.cursor = 'grab';
                const box = node.getBoundingClientRect();
                const centerX = box.left + box.width / 2, centerY = box.top + box.height / 2;
                const target = (options.targets || []).find((candidate) => {
                    const area = candidate.getBoundingClientRect();
                    return centerX > area.left && centerX < area.right && centerY > area.top && centerY < area.bottom;
                });
                const accepted = target && options.onDrop ? options.onDrop(target, node) !== false : false;
                if (!accepted) {
                    node.style.transition = reducedMotion ? 'none' : 'transform .35s cubic-bezier(.34,1.56,.64,1)';
                    node.style.transform = 'translate(' + originX + 'px,' + originY + 'px)';
                    setTimeout(() => { node.style.transition = ''; }, 400);
                }
            });
        },

        /** Short star burst for a right answer, centred on an element (or the stage). */
        celebrate: (node) => {
            const area = (node || byId('stage')).getBoundingClientRect();
            const colours = (window.Viz.color('--palette') || '#FFD166').split(',').map((colour) => colour.trim());
            for (let i = 0; i < (reducedMotion ? 0 : 18); i++) {
                const star = element('span', 'viz-star', '★');
                star.style.left = area.left + area.width / 2 + 'px';
                star.style.top = area.top + area.height / 2 + 'px';
                star.style.color = colours[i % colours.length];
                document.body.append(star);
                const angle = (Math.PI * 2 * i) / 18, distance = 80 + Math.random() * 90;
                star.animate([
                    { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
                    { transform: 'translate(calc(-50% + ' + Math.cos(angle) * distance + 'px), calc(-50% + ' + Math.sin(angle) * distance + 'px)) scale(1.2)', opacity: 0 },
                ], { duration: 900, easing: 'cubic-bezier(.22,1,.36,1)' }).onfinish = () => star.remove();
            }
            window.Viz.hint('做得好！', 'ok');
        },

        /** Gentle message over the stage, e.g. Viz.hint('再試一次') for a wrong answer. */
        hint: (text, tone) => {
            const toast = element('div', 'viz-hint' + (tone === 'ok' ? ' ok' : ''), text);
            byId('stage').append(toast);
            setTimeout(() => toast.remove(), 1800);
        },

        /** Update the game HUD (game layout) or a floating badge: Viz.score(3), Viz.round(2, 5). */
        score: (value) => { const target = byId('hud-score'); if (target) target.textContent = value; },
        round: (current, total) => { const target = byId('hud-round'); if (target) target.textContent = current + ' / ' + total; },

        /** requestAnimationFrame loop that pauses when the tab is hidden; Space toggles it. */
        loop: (frame) => {
            let last = performance.now(), paused = false;
            const tick = (now) => {
                if (!paused && !document.hidden) frame(Math.min(0.05, (now - last) / 1000), now / 1000);
                last = now;
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            runningLoop = { pause: () => { paused = true; }, play: () => { paused = false; }, toggle: () => { paused = !paused; }, isPaused: () => paused };
            return runningLoop;
        },
    };

    document.addEventListener('DOMContentLoaded', () => {
        const style = element('style');
        style.textContent = '.viz-field{display:flex;flex-direction:column;gap:6px}.viz-value{font-weight:700;color:var(--accent)}'
            + '.viz-toggle{display:flex;align-items:center;gap:10px;min-height:56px;font-weight:600}.viz-toggle input{width:28px;height:28px;accent-color:var(--accent)}'
            + '.viz-star{position:fixed;pointer-events:none;font-size:28px;z-index:50}'
            + '.viz-hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:var(--surface);color:var(--fg);border:2px solid var(--warn);font-weight:700;box-shadow:var(--shadow);z-index:20}'
            + '.viz-hint.ok{border-color:var(--ok)}.btn:disabled{opacity:.4;cursor:default}'
            + '.viz-stepbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:8px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-weight:600;z-index:15}'
            + '.viz-stepbar .text{padding:0 6px}.viz-stepbar #step-indicator{color:var(--muted);white-space:nowrap}'
            + '.viz-dock{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:10px;max-width:300px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);z-index:15}';
        document.head.append(style);

    });

    // One delegated listener, so chrome buttons work whether they come from the skeleton or are created later.
    document.addEventListener('click', (event) => {
        const button = event.target.closest && event.target.closest('#prev-btn, #next-btn, #reset-btn, #fullscreen-btn');
        if (!button) return;
        if (button.id === 'prev-btn') showStep(currentStep - 1, 'back');
        if (button.id === 'next-btn') showStep(currentStep + 1, 'forward');
        if (button.id === 'reset-btn') reset();
        if (button.id === 'fullscreen-btn') toggleFullscreen();
    });

    document.addEventListener('keydown', (event) => {
        if (event.target.closest && event.target.closest('input, textarea')) return;
        if (event.key === 'ArrowRight') showStep(currentStep + 1, 'forward');
        if (event.key === 'ArrowLeft') showStep(currentStep - 1, 'back');
        if (event.key === 'r' || event.key === 'R') reset();
        if (event.key === 'f' || event.key === 'F') toggleFullscreen();
        if (event.key === ' ' && runningLoop) { event.preventDefault(); runningLoop.toggle(); }
    });
})();

</script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>探索太陽系八大行星</h1>
      <p class="goal">認識太陽系八大行星按距日遠近的排列次序與繞日公轉特點</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="reset-btn" type="button">↺ 重新開始</button>
    <button class="btn" id="fullscreen-btn" type="button" aria-label="全螢幕 (F)">全螢幕</button>
  </header>
  
  <main id="stage" class="card" aria-label="演示畫面">
    <div id="disclaimer">示意圖（比例不準確）：天體大小與軌道間距並非真實比例</div>
    <div id="info-card" class="glass-panel">
      <h2 id="info-title">行星名稱 <span style="font-size: 18px; color: var(--muted);" id="info-en"></span></h2>
      <div class="order" id="info-order">距日次序</div>
      <p id="info-desc">趣味特點描述</p>
    </div>
    <!-- WebGL Canvas will be injected here -->
  </main>
  
  <div id="controls" class="card" aria-label="控制面板">
    <button class="btn primary" id="ctrl-play-pause">⏸ 暫停公轉</button>
    <div class="slider-group">
      <label for="ctrl-speed" style="white-space: nowrap;">公轉速度：<span id="speed-display">1.0</span>x</label>
      <input type="range" id="ctrl-speed" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>
    <button class="btn" id="ctrl-reset-view">🔍 全景重設</button>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

gsap.registerPlugin(Draggable, MotionPathPlugin);

// Utility for reduced motion
const isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const getDuration = (s) => isReduced ? 0 : s;

// --- Data & State ---
const PLANET_DATA = [
  { id: 'mercury', name: '水星', en: 'Mercury', r: 0.6, dist: 8, speed: 4.1, color: 0xaaaaaa, order: '第一顆行星', desc: '距太陽最近的行星，表面佈滿隕石坑，日夜溫差極大。' },
  { id: 'venus', name: '金星', en: 'Venus', r: 1.2, dist: 13, speed: 1.6, color: 0xFFD27F, order: '第二顆行星', desc: '大小與地球相近，但表面溫度極高，被濃厚的二氧化碳雲層覆蓋。' },
  { id: 'earth', name: '地球', en: 'Earth', r: 1.3, dist: 19, speed: 1.0, color: 0x7FE6E0, order: '第三顆行星', desc: '我們的家園，表面有豐富的液態水，是目前已知唯一孕育生命的星球。' },
  { id: 'mars', name: '火星', en: 'Mars', r: 0.7, dist: 25, speed: 0.5, color: 0xFFA893, order: '第四顆行星', desc: '被稱為「紅色星球」，表面常有沙塵暴，科學家積極在此探索生命痕跡。' },
  { id: 'jupiter', name: '木星', en: 'Jupiter', r: 3.5, dist: 35, speed: 0.2, color: 0xD4A373, order: '第五顆行星', desc: '太陽系體積最大的行星，是一顆氣體巨星，表面有標誌性的「大紅斑」風暴。' },
  { id: 'saturn', name: '土星', en: 'Saturn', r: 2.8, dist: 47, speed: 0.08, color: 0xE9C46A, order: '第六顆行星', desc: '擁有極其美麗且寬闊的光環系統，光環主要由無數冰塊和岩石碎屑組成。', hasRing: true },
  { id: 'uranus', name: '天王星', en: 'Uranus', r: 2.0, dist: 59, speed: 0.04, color: 0x48CAE4, order: '第七顆行星', desc: '自轉軸極度傾斜，是一顆「躺著自轉」的冰巨星，大氣含甲烷而呈現藍綠色。' },
  { id: 'neptune', name: '海王星', en: 'Neptune', r: 1.9, dist: 70, speed: 0.02, color: 0x0077B6, order: '第八顆行星', desc: '距太陽最遠的行星，風速為太陽系之冠，是一顆極端寒冷的藍色冰巨星。' }
];

const STATE = {
  isPlaying: true,
  baseSpeedMultiplier: 1.0,
  animatingSpeed: { value: 1.0 }, // Used for GSAP tweening
  activePlanet: null,
  meshes: [],       // actual sphere meshes for raycasting
  orbitGroups: [],  // groups that rotate
  orbitLines: [],   // materials of lines
  labels: []
};

// --- Three.js Setup ---
const stage = document.getElementById('stage');
const width = stage.clientWidth;
const height = stage.clientHeight;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x090418, 0.006);

const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 80, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(width, height);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0px';
labelRenderer.domElement.style.pointerEvents = 'none'; // allow clicks to pass through to webgl
stage.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxDistance = 150;
controls.minDistance = 10;

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
scene.add(ambientLight);

const sunLight = new THREE.PointLight(0xFFF0D0, 3, 200);
scene.add(sunLight);

// --- Background Stars ---
const createStars = () => {
  const starsGeo = new THREE.BufferGeometry();
  const starsCount = 1000;
  const posArray = new Float32Array(starsCount * 3);
  for(let i = 0; i < starsCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 300;
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  const starsMat = new THREE.PointsMaterial({ size: 0.5, color: 0xffffff, transparent: true, opacity: 0.6 });
  const starsMesh = new THREE.Points(starsGeo, starsMat);
  scene.add(starsMesh);
};
createStars();

// --- Build Solar System ---
const sunGeo = new THREE.SphereGeometry(4.5, 32, 32);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFD27F });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
scene.add(sunMesh);

// Add a soft glow to the sun
const sunGlowGeo = new THREE.SphereGeometry(5.5, 32, 32);
const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xFF9900, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, side: THREE.BackSide });
const sunGlow = new THREE.Mesh(sunGlowGeo, sunGlowMat);
scene.add(sunGlow);

// Halo mesh (reusable for active planet highlight)
const haloGeo = new THREE.SphereGeometry(1, 32, 32);
const haloMat = new THREE.MeshBasicMaterial({ color: 0x7FE6E0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
scene.add(haloMesh);

PLANET_DATA.forEach((data) => {
  // 1. Orbit Group (handles revolution)
  const orbitGroup = new THREE.Group();
  
  // Randomize initial angle so they aren't lined up
  orbitGroup.rotation.y = Math.random() * Math.PI * 2;
  scene.add(orbitGroup);
  
  // 2. Planet Mesh
  const geo = new THREE.SphereGeometry(data.r, 32, 32);
  const mat = new THREE.MeshStandardMaterial({ 
    color: data.color, 
    roughness: 0.6, 
    metalness: 0.1,
    transparent: true,
    opacity: 1
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.x = data.dist;
  mesh.userData = data; // store data for interaction
  orbitGroup.add(mesh);
  
  STATE.meshes.push(mesh);
  STATE.orbitGroups.push({ group: orbitGroup, speed: data.speed });

  // 3. Saturn's Ring
  if (data.hasRing) {
    const ringGeo = new THREE.RingGeometry(data.r * 1.4, data.r * 2.2, 64);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 2 - 0.2; // tilt
    mesh.add(ringMesh);
    mesh.userData.ringMat = ringMat; // save ref for dimming
  }

  // 4. Orbit Line (visual path)
  const pathGeo = new THREE.BufferGeometry();
  const pts = [];
  for(let i = 0; i <= 64; i++) {
    const theta = (i / 64) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(theta) * data.dist, 0, Math.sin(theta) * data.dist));
  }
  pathGeo.setFromPoints(pts);
  const pathMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
  const pathLine = new THREE.Line(pathGeo, pathMat);
  scene.add(pathLine);
  STATE.orbitLines.push(pathMat);

  // 5. CSS2D Label
  const labelDiv = document.createElement('div');
  labelDiv.className = 'planet-label';
  labelDiv.textContent = data.name;
  const labelObj = new CSS2DObject(labelDiv);
  labelObj.position.set(0, data.r + 0.5, 0);
  mesh.add(labelObj);
  STATE.labels.push(labelDiv);
});

// --- Interaction Logic ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onCanvasClick(event) {
  // Convert mouse position to normalized device coordinates
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(STATE.meshes);

  if (intersects.length > 0) {
    focusPlanet(intersects[0].object);
  }
}

renderer.domElement.addEventListener('pointerdown', onCanvasClick);

function focusPlanet(mesh) {
  const data = mesh.userData;
  if (STATE.activePlanet === mesh) return;
  STATE.activePlanet = mesh;

  // Calculate target positions
  const targetPos = new THREE.Vector3();
  mesh.getWorldPosition(targetPos);

  // Camera offset: position camera outside the planet, looking at it. 
  // Offset depends on planet size to frame it well, favoring the left side so info card fits right.
  const camOffset = new THREE.Vector3(data.r * 5, data.r * 2.5, data.r * 5);
  // Rotate offset based on the planet's current world position to keep perspective outward
  const angle = Math.atan2(targetPos.z, targetPos.x);
  camOffset.applyAxisAngle(new THREE.Vector3(0,1,0), angle);
  
  const camFinalPos = targetPos.clone().add(camOffset);

  // --- GSAP Motions (Per Spec) ---

  // 1. Camera: "距離原點 80 單位的傾斜俯瞰全景視角 -> 目標行星中心點, 1.2 秒, power2.inOut"
  gsap.to(camera.position, {
    x: camFinalPos.x, y: camFinalPos.y, z: camFinalPos.z,
    duration: getDuration(1.2),
    ease: "power2.inOut"
  });
  gsap.to(controls.target, {
    x: targetPos.x, y: targetPos.y, z: targetPos.z,
    duration: getDuration(1.2),
    ease: "power2.inOut"
  });

  // 2. Surroundings Dimming: "其餘行星與太陽亮度降低至 40%，背景星空微暗"
  STATE.meshes.forEach(m => {
    if (m !== mesh) {
      gsap.to(m.material, { opacity: 0.2, duration: getDuration(1.2) });
      if(m.userData.ringMat) gsap.to(m.userData.ringMat, { opacity: 0.1, duration: getDuration(1.2) });
    } else {
      gsap.to(m.material, { opacity: 1, duration: getDuration(0.5) });
      if(m.userData.ringMat) gsap.to(m.userData.ringMat, { opacity: 0.8, duration: getDuration(0.5) });
    }
  });
  gsap.to(sunMat, { opacity: 0.4, transparent: true, duration: getDuration(1.2) });
  gsap.to(sunGlowMat, { opacity: 0.05, duration: getDuration(1.2) });
  STATE.labels.forEach(l => { l.style.opacity = '0.2'; });
  mesh.children.forEach(c => { if(c instanceof CSS2DObject) c.element.style.opacity = '1'; });

  // "選取的行星邊緣產生淡藍色光暈輪廓"
  haloMesh.scale.setScalar(data.r * 1.3);
  gsap.to(haloMat, { opacity: 0.4, duration: getDuration(1.0), delay: getDuration(0.5) });

  // 3. Info Card: "0.4 秒, back.out(1.4) 彈出"
  const card = document.getElementById('info-card');
  document.getElementById('info-title').innerHTML = `${data.name} <span style="font-size: 18px; color: var(--muted);">${data.en}</span>`;
  document.getElementById('info-order').innerText = data.order;
  document.getElementById('info-desc').innerText = data.desc;
  
  // Trigger after camera motion (delay 1.0)
  gsap.fromTo(card, 
    { opacity: 0, scale: 0.8 }, 
    { opacity: 1, scale: 1, duration: getDuration(0.4), ease: "back.out(1.4)", delay: getDuration(1.0) }
  );
}

function resetView() {
  STATE.activePlanet = null;

  // "全景重設"
  gsap.to(camera.position, {
    x: 0, y: 80, z: 80,
    duration: getDuration(1.2),
    ease: "power2.inOut"
  });
  gsap.to(controls.target, {
    x: 0, y: 0, z: 0,
    duration: getDuration(1.2),
    ease: "power2.inOut"
  });

  // Restore opacities
  STATE.meshes.forEach(m => {
    gsap.to(m.material, { opacity: 1, duration: getDuration(1.2) });
    if(m.userData.ringMat) gsap.to(m.userData.ringMat, { opacity: 0.8, duration: getDuration(1.2) });
  });
  gsap.to(sunMat, { opacity: 1, duration: getDuration(1.2) });
  gsap.to(sunGlowMat, { opacity: 0.2, duration: getDuration(1.2) });
  gsap.to(haloMat, { opacity: 0, duration: getDuration(0.5) });
  STATE.labels.forEach(l => { l.style.opacity = '0.8'; });

  // Hide Card
  const card = document.getElementById('info-card');
  gsap.to(card, { opacity: 0, scale: 0.8, duration: getDuration(0.3) });
}

// --- UI Controls Binding ---
const btnPlayPause = document.getElementById('ctrl-play-pause');
const sliderSpeed = document.getElementById('ctrl-speed');
const valSpeed = document.getElementById('speed-display');
const btnResetView = document.getElementById('ctrl-reset-view');

btnPlayPause.addEventListener('click', () => {
  STATE.isPlaying = !STATE.isPlaying;
  btnPlayPause.innerHTML = STATE.isPlaying ? '⏸ 暫停公轉' : '▶️ 繼續公轉';
  btnPlayPause.classList.toggle('primary', STATE.isPlaying);
  
  // "時長 0.3 秒減速停止或恢復勻速，使用 power1.out"
  const targetSpeed = STATE.isPlaying ? STATE.baseSpeedMultiplier : 0;
  gsap.to(STATE.animatingSpeed, {
    value: targetSpeed,
    duration: getDuration(0.3),
    ease: "power1.out"
  });

  // "軌道線亮度短暫閃爍一下以示狀態切換"
  if(!isReduced) {
    STATE.orbitLines.forEach(mat => {
      gsap.to(mat, { opacity: 0.6, duration: 0.15, yoyo: true, repeat: 1, onComplete: () => { mat.opacity = 0.15; } });
    });
  }
});

sliderSpeed.addEventListener('input', (e) => {
  const val = parseFloat(e.target.value);
  valSpeed.innerText = val.toFixed(1);
  STATE.baseSpeedMultiplier = val;
  if (STATE.isPlaying) {
    STATE.animatingSpeed.value = val; // Apply immediately if playing
  }
});

btnResetView.addEventListener('click', resetView);

// Global top-bar reset
document.getElementById('reset-btn').addEventListener('click', () => {
  resetView();
  STATE.isPlaying = true;
  btnPlayPause.innerHTML = '⏸ 暫停公轉';
  btnPlayPause.classList.add('primary');
  sliderSpeed.value = 1.0;
  valSpeed.innerText = '1.0';
  STATE.baseSpeedMultiplier = 1.0;
  STATE.animatingSpeed.value = 1.0;
});

// Fullscreen wrapper
document.getElementById('fullscreen-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'f') document.getElementById('fullscreen-btn').click();
  if (e.key === ' ') { e.preventDefault(); btnPlayPause.click(); }
  if (e.key.toLowerCase() === 'r') document.getElementById('reset-btn').click();
});

// --- Animation Loop ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const dt = Math.min(clock.getDelta(), 0.1); // cap dt to prevent jumps on lag
  
  // Orbit rotation
  const speedFactor = STATE.animatingSpeed.value * dt;
  if (speedFactor > 0.0001) {
    STATE.orbitGroups.forEach(item => {
      // Rotate group around Y axis
      item.group.rotation.y += item.speed * speedFactor * 0.5;
    });
  }

  // Update Halo position if active planet exists
  if (STATE.activePlanet) {
    const pos = new THREE.Vector3();
    STATE.activePlanet.getWorldPosition(pos);
    haloMesh.position.copy(pos);
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// Handle Resize
window.addEventListener('resize', () => {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
});

// Start
animate();

</script>
</body>
</html>
